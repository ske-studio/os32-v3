[[check]]
id = "ppc_media_build"
ppc_seconds = { core = 1, link = 1, sh = 82, link-sh = 1, powermac = 8, neg1 = 1 }
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品媒体と互換名" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:iso", "tests/support/media.py", "sys/conf/images/ppc-flags.mk", "build/targets/ppc-powermac.mk", "build/ppc-install-boot.mk", "tools/ppc/boot_media.py", "tools/ppc/root_lz4_inventory.py", "tools/ppc/root_lz4_layout.py"]
environment = "linux-ppc-cross"
arch = { ppc = ["core", "link", "sh", "link-sh", "powermac", "neg1"] }
needs = []
expect = "ビルド成功、PPCKERN.ELF と boot.iso が非空、構成名・出力先・旧旗の拒否理由・実像の帯と root を照合"
limits = "起動到達と再生成時の一致は別の検査"
gates = ["push", "main"]
mutations = [{ id = "ppc_core_missing_iso", config = "core", when = "after_build", remove = "build/out/ppc-kboot/boot.iso", fail = "missing boot.iso" },
    { id = "legacy_shell_negative", config = "powermac", when = "after_build", replace = "sys/conf/images/ppc-flags.mk", old = "$(error KBOOT_SHELL does not support NEGATIVE)", new = "# removed legacy guard", fail = "legacy shell accepted NEGATIVE" }]

[[check]]
id = "x86_media_build"
spec = { path = "docs/design/tools/checks/tests_v2.md", section = "配布物と再生成の合否" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:kernel-r1", "make:deploy-u3", "make:iso"]
environment = "linux-x86-cross"
arch = { x86 = ["pc98"] }
needs = []
expect = "PC-98 配布物が揃い FD と HostDrv が同じカーネルを持つ"
limits = "起動は別の検査"
gates = ["push", "main"]
mutations = [{ id = "x86_missing_iso", config = "pc98", remove = "images/os32_install.iso", fail = "missing os32_install.iso", when = "after_build" }]

[[check]]
id = "ppc_common_compile"
ppc_seconds = { powermac = 4 }
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品での共通ソース検査" }
subsystem = "infra"
level = "L1"
sources = ["make:common-compile", "build/targets/ppc-powermac.mk", "build/sources/common.mk"]
environment = "linux-ppc-cross"
arch = { ppc = ["powermac"] }
needs = []
expect = "共通の各入力が PowerPC の再配置可能 ELF を生成する"
limits = "リンクと起動は保証しない"
gates = ["push", "main"]
mutations = [{ id = "common_missing_object", config = "powermac", remove = "build/out/ppc-powermac/sys/kern/mm/dma_pool.o", fail = "missing dma_pool.o", when = "after_build" }]

[[check]]
id = "build_identity"
ppc_seconds = { core = 9, link = 10, sh = 65, link-sh = 63, powermac = 68, neg1 = 9 }
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品の再生成" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:kernel-r1", "make:deploy-u3", "make:iso", "tests/support/media.py", "build/ppc-install-boot.mk"]
environment = "linux-cross"
arch = { x86 = ["pc98"], ppc = ["core", "link", "sh", "link-sh", "powermac", "neg1"] }
needs = []
expect = "同じ入力から再生成した生成物の集合とバイトが一致する"
limits = "PowerPC boot.iso は非空とサイズ、生成された root_image_blob.o は存在を確認"
gates = ["main"]
mutations = [{ id = "ppc_changed_elf", config = "core", append = "build/out/ppc-kboot/PPCKERN.ELF", fail = "different artifacts: build/out/ppc-kboot/PPCKERN.ELF", when = "after_build" }]

[[check]]
id = "registry_fields"
spec = { path = "docs/design/tools/checks/registry_v2.md", section = "P4 順 1 の登録" }
subsystem = "infra"
level = "M"
sources = ["tests/registry.toml", "tests/support/registry.py"]
environment = "python"
arch = { host = ["local"] }
needs = []
expect = "登録が通り、必須の欄を欠く登録を lint が拒否する"
limits = "製品の実行結果は調べない"
gates = ["push", "main"]
mutations = [{ id = "allow_unsafe_config", config = "local", replace = "tests/support/registry.py", old = "and all(map(config_component, values))", new = "and True", fail = "unsafe configuration accepted", when = "after_build" },
             { id = "allow_oversized_weight", config = "local", when = "after_build", replace = "tests/support/registry.py", old = "0 < n <= PPC_BUNDLE_SECONDS", new = "0 < n", fail = "invalid PPC weight accepted" },
             { id = "lint_accepts_missing", config = "local", replace = "tests/support/registry.py", old = "missing = FIELDS", new = "row.setdefault('needs', [])\n        missing = FIELDS", fail = "missing field not rejected: needs", when = "after_build" }]

[[check]]
id = "ppc_boot"
ppc_seconds = { core = 3, link = 5, sh = 7, link-sh = 7, powermac = 6, neg1 = 3 }
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品の無入力起動" }
subsystem = "system"
level = "L4"
sources = ["make:all", "make:iso", "tests/support/ppc_vm.py", "tests/support/media.py", "sys/platform/powermac/shell_loop_ops.c"]
environment = "qemu-ppc"
arch = { ppc = ["core", "link", "sh", "link-sh", "powermac", "neg1"] }
needs = []
expect = "6像の起動順と否定像を両 CPU で検証"
limits = "mac99 TCG の起動40秒"
gates = ["push", "main"]
mutations = [{ id = "boot_wrong_config", config = "core", when = "after_build", replace = "7450/boot-serial.log", old = "KBOOT READY stage=pre-user", new = "KBOOT HALTED", fail = "boot did not reach KBOOT READY" }, { id = "missing_7455", config = "core", when = "after_build", remove = "7455/boot-serial.log", fail = "missing 7455 boot serial" }]

[[check]]
id = "collection_contract"
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品の収集計画" }
subsystem = "infra"
level = "M"
sources = ["tests/infra/ci.py", "tests/support/impact.py", "tools/ownership_images.py", "tests/support/registry.py", ".github/workflows/restructure-build.yml", ".github/workflows/restructure-check-bundle.yml", "tests/registry.toml"]
environment = "python-yaml"
arch = { host = ["local"] }
needs = []
expect = "変更ファイルが入る宣言済みの像と仕様文書を読む検査を選び、独立した失敗の後も全件を集計し、欠落と禁じた再利用を拒む"
limits = "ローカルの実行器・集計器まで"
gates = ["push", "main"]
mutations = [{ id = "allow_linked_root", config = "local", replace = "tests/infra/ci.py", old = "if destination.is_symlink():", new = "if destination.is_symlink() and destination.parent != output:", fail = "accepted linked component evidence", when = "after_build" },
             { id = "allow_linked_row", config = "local", replace = "tests/infra/ci.py", old = "if destination.is_symlink():", new = "if destination.is_symlink() and component != name:", fail = "accepted linked component evidence/first", when = "after_build" },
             { id = "omit_evidence_upload", config = "local", replace = ".github/workflows/restructure-check-bundle.yml", old = "/results/evidence/", new = "/results/absent/", fail = "failure evidence upload missing", when = "after_build" },
             { id = "omit_net_image", config = "local", replace = "tests/support/impact.py", old = "row[\"environment\"].startswith(\"qemu-ppc\")", new = "row[\"environment\"] == \"qemu-ppc\"", fail = "net fixture image selection", when = "after_build" },
             { id = "forward_red", config = "local", replace = "tests/infra/ci.py", old = "if result != \"RED\" else None", new = "if True else None", fail = "expected RED forwarded", when = "after_build" },
             { id = "first_missing_only", config = "local", replace = "tests/infra/ci.py", old = 'raise MissingPrerequisites("\n".join(sorted(missing)))', new = 'raise MissingPrerequisites("\n".join(sorted(missing)[:1]))', fail = "missing prerequisites incomplete", when = "after_build" },
             { id = "drop_userland_check", config = "local", replace = "tests/support/impact.py", old = '{"ring3_instructions", "c_dialect",', new = '{"c_dialect",', fail = "userland checks", when = "after_build" },
             { id = "drop_declared_configs", config = "local", replace = "tests/support/impact.py", old = "declared_configs.update(config for config, _ in outputs)", new = "declared_configs.clear()", fail = "declared images:", when = "after_build" },
             { id = "drop_spec_input", config = "local", replace = "tests/support/impact.py", old = 'direct.add("test_registration")', new = "pass", fail = "spec input:", when = "after_build" },
             { id = "drop_shared_program", config = "local", replace = "tests/support/impact.py", old = "if shared_programs:", new = "if False:", fail = "shared program inputs", when = "after_build" },
             { id = "allow_reuse", config = "local", replace = "tests/infra/ci.py", old = 'allowed = ("PASS", "FAIL",', new = 'allowed = ("REUSED", "PASS", "FAIL",', fail = "REUSED must be rejected", when = "after_build" }]

[[check]]
id = "landing_evidence"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§8 取り込み SHA の固定" }
subsystem = "infra"
level = "M"
sources = ["tools/ci/land_gate.py", "tools/ci_fetch.sh", "tests/support/impact.py"]
environment = "python-yaml"
arch = { host = ["local"] }
needs = []
expect = "候補 SHA の指定 run の最新 attempt の成功と両機種の今回の起動記録が揃う"
limits = "API 応答を与えた関門の判定。媒体自体の起動は別の検査"
gates = ["push", "main"]
mutations = [
    { id = "accept_failed_summary", config = "local", replace = "tools/ci/land_gate.py", old = 'or summary["rc"] != 0', new = 'or False', fail = "invalid summary rc accepted", when = "after_build" },
    { id = "accept_built", config = "local", replace = "tools/ci/land_gate.py", old = 'if sum(row["name"] == marker and not row["expired"] for row in artifacts) != 1:', new = "if False:", fail = "BUILT accepted for landing", when = "after_build" },
    { id = "accept_stale_attempt", config = "local", replace = "tools/ci/land_gate.py", old = "or number(run['run_attempt']) != attempt", new = "or False", fail = "invalid run_attempt accepted", when = "after_build" },
    { id = "accept_failed_selftest", config = "local", replace = "tools/ci/land_gate.py", old = "if type(count) is not int or count != 0:", new = "if False:", fail = "invalid PC-98 selftest count accepted", when = "after_build" },
    { id = "require_fd_selftest", config = "local", replace = "tools/ci/land_gate.py", old = "if kind == 'hdd':", new = "if True:", fail = "PC-98 requires selftest_fail=0", when = "after_build" },
    { id = "accept_fd_for_distribution", config = "local", replace = "tools/ci/land_gate.py", old = "('distribution', 'hdd'), ('fd', 'fd')", new = "('distribution', 'hdd'), ('distribution', 'fd'), ('fd', 'fd')", fail = "FD accepted for distribution", when = "after_build" },
    { id = "ignore_fd_commit", config = "local", replace = "tools/ci/land_gate.py", old = "or not run['head_sha'].startswith(commit)", new = "or False", fail = "wrong FD Commit accepted", when = "after_build" },
    { id = "accept_partial_boot", config = "local", replace = "tools/ci/land_gate.py", old = "if machines != required:", new = "if not machines:", fail = "missing PowerMac boot accepted", when = "after_build" },
]

[[check]]
id = "src_owner"
spec = { path = "docs/design/build/ownership.md", section = "追跡パスの所有と配置" }
subsystem = "infra"
level = "L0"
sources = ["build/sources/ownership.mk", "tools/ownership.py"]
environment = "python"
arch = { host = ["local"] }
needs = []
expect = "追跡パスが一意に所属し、許された棚にある"
limits = "候補の Git 索引"
gates = ["push", "main"]
mutations = [{ id = "owner_conflict", config = "local", when = "after_build", replace = "build/sources/ownership.mk", old = "OWN_FILE += Makefile|ビルドの定義|-", new = "OWN_FILE += Makefile|ビルドの定義|-\nOWN_FILE += Makefile|文書|-", fail = "conflicting OWN_FILE Makefile" },
    { id = "misplaced_cpu_header", config = "local", when = "after_build", replace = "build/sources/ownership.mk", old = "OWN_PLACEMENT += sys/include|共通実装", new = "OWN_PLACEMENT += sys/include|共通実装\nOWN_FILE += sys/include/boot_token.h|CPU固有実装|x86", fail = "misplaced sys/include/boot_token.h" }]

[[check]]
id = "build_sources"
ppc_seconds = { core = 10, link = 5, sh = 7, link-sh = 7, powermac = 7, neg1 = 5 }
spec = { path = "docs/decisions/ppc/PPC_SHELL_ALIGN_X86_DESIGN.md", section = "製品のコンパイル集合" }
subsystem = "infra"
level = "L0"
sources = ["build/sources/ownership.mk", "make:all", "make:iso", "tests/support/product.py"]
