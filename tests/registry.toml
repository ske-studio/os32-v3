    { id = "omit_aborted_stop_cleanup", config = "link-sh", when = "after_build", replace = "sys/kern/exec/exec_finish.inc", old = "if (kind == EXEC_KIND_ABORTED) input_discard_stop();", new = "(void)kind;", fail = "first arch entry or failed reservation" },
    { id = "omit_child_abort_restore", config = "pc98", when = "after_build", replace = "sys/kern/exec/exec_finish.inc", old = "if (id != APP_ID_SHELL) exec_restore_context(launcher_id);", new = "(void)launcher_id;", fail = "first arch entry or failed reservation" },
