[[check]]
id = "input_focus"
spec = { path = "docs/decisions/INPUT_HAL_DESIGN.md", section = "10.3 登録検査を先行させる" }
subsystem = "input"
level = "L1"
sources = ["sys/hal/input/legacy_ring.c", "sys/kapi/kapi_in2.c", "sys/hal/input/in2_reclaim.c", "sys/hal/input/kbd_merge.c", "sys/platform/pc98/platform_input_caps.h", "sys/platform/powermac/platform_input_caps.h", "sys/hal/input/in2_excl.c", "sys/hal/input/keymap_registry.c", "sys/hal/input/keymap_eval.c", "sys/hal/input/keymap_state.c", "sys/hal/input/legacy_keymap.c", "sys/hal/input/legacy_mode.c", "sys/input/keymaps/hid_jp.c", "tests/support/fixtures/input_policy/focus.c", "tests/support/fixtures/input_policy/entry.S"]
environment = "linux-x86-cross"
arch = { x86 = ["pc98"] }
needs = []
expect = "KBD→MOUSE で保持を採取し、解放世代が進むと次の make を通す。制御キーは独占中も通す"
limits = "物理イベントと LOST の出力先は host fixture。実機 IRQ は観測しない"
gates = ["push", "main"]
mutations = [{ id = "omit_held_snapshot", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_excl.c", old = "valid[sc] = input_key_pressed(sc);", new = "valid[sc] = 0;", fail = "exclusive transition changed delivery" },
    { id = "first_break_advances", config = "pc98", when = "after_build", replace = "sys/hal/input/kbd_merge.c", old = "!down && cnt[sc] == 0", new = "!down", fail = "exclusive transition changed delivery" },
    { id = "pc98_acquire_closed", config = "pc98", when = "after_build", replace = "sys/platform/pc98/platform_input_caps.h", old = "IN2_PUBLIC_EXCLUSIVE 1", new = "IN2_PUBLIC_EXCLUSIVE 0", fail = "exclusive transition changed delivery" },
    { id = "powermac_acquire_closed", config = "pc98", when = "after_build", replace = "sys/platform/powermac/platform_input_caps.h", old = "IN2_PUBLIC_EXCLUSIVE 1", new = "IN2_PUBLIC_EXCLUSIVE 0", fail = "exclusive transition changed delivery" },
    { id = "focus_lost_reordered", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_reclaim.c", old = "in2_ring_lost(IN2_LOST_FOCUS);\n    in2_excl_focus(old);", new = "in2_excl_focus(old);\n    in2_ring_lost(IN2_LOST_FOCUS);", fail = "exclusive transition changed delivery" },
    { id = "suppress_key_stop", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_excl.c", old = "sc == KEY_STOP", new = "0", fail = "exclusive transition changed delivery" },
    { id = "suppress_key_ctrl", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_excl.c", old = "sc == KEY_CTRL", new = "0", fail = "exclusive transition changed delivery" },
    { id = "suppress_key_grph", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_excl.c", old = "sc == KEY_GRPH", new = "0", fail = "exclusive transition changed delivery" },
    { id = "suppress_key_tab", config = "pc98", when = "after_build", replace = "sys/hal/input/in2_excl.c", old = "sc == KEY_TAB", new = "0", fail = "exclusive transition changed delivery" },
    { id = "gate_in2_during_kbd", config = "pc98", when = "after_build", replace = "sys/hal/input/kbd_merge.c", old = "if (!legacy_active()) input_emit_in2(e);", new = "if (!legacy_active() && !in2_excl_keyboard()) input_emit_in2(e);", fail = "exclusive transition changed delivery" }]

[[check]]
id = "gshell_excl"
spec = { path = "docs/decisions/INPUT_HAL_DESIGN.md", section = "10.3 登録検査を先行させる" }
subsystem = "input"
level = "L1"
sources = ["userland/gshell/src/excl.rs", "userland/gshell/src/raw_keyboard.rs", "userland/gshell/src/stop_dispatch.rs", "userland/gshell/src/cursor.rs", "userland/gshell/src/input.rs", "tests/support/fixtures/input_policy/gshell.rs"]
environment = "linux-x86-cross"
arch = { x86 = ["pc98"] }
needs = []
expect = "焦点通知失敗から再試行し、旧窓の release を一件ずつ再送。通常窓は独占中ゼロ・解除後一件。ドラッグ取消と静止カーソル復帰を確認。退避・配送満杯でも STOP と二つの切替を処理する"
limits = "WM の ring と焦点通知は host fixture"
gates = ["push", "main"]
mutations = [{ id = "skip_hidden_stationary_cursor", config = "pc98", when = "after_build", replace = "userland/gshell/src/cursor.rs", old = "if st.cursor.shown && st.cursor.x == x", new = "if st.cursor.x == x", fail = "incorrect old-window release" },
    { id = "repeat_wm_stop", config = "pc98", when = "after_build", replace = "userland/gshell/src/stop_dispatch.rs", old = "st.abort_seen = false;", new = "// leave STOP pending", fail = "incorrect old-window release" },
    { id = "skip_static_cursor", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "crate::cursor::move_to(st, mx, my);", new = "// leave cursor hidden", fail = "incorrect old-window release" },
    { id = "skip_drag_cancel", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "if st.drag_index >= 0 { wm::drop_drag_frame(st); }", new = "// omitted", fail = "incorrect old-window release" },
    { id = "remove_window_capture_gate", config = "pc98", when = "after_build", replace = "userland/gshell/src/raw_keyboard.rs", old = "if !st.excl.open(crate::excl::KBD) { return Step::Consumed; }", new = "// capture gate removed", fail = "incorrect old-window release" },
    { id = "block_controls_on_full_delivery", config = "pc98", when = "after_build", replace = "userland/gshell/src/raw_keyboard.rs", old = "if !space_ok && ordinary_pump", new = "if !space_ok", fail = "incorrect old-window release" },
    { id = "block_controls_on_full_defer", config = "pc98", when = "after_build", replace = "userland/gshell/src/raw_keyboard.rs", old = "if ordinary_pump && !ui_defer &&", new = "if !ui_defer &&", fail = "incorrect old-window release" },
    { id = "accept_failed_focus", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "st.excl.focus_confirmed = crate::multiapp::av_owner() == next.owner;", new = "st.excl.focus_confirmed = true;", fail = "incorrect old-window release" },
    { id = "repeat_settled_key", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "st.excl.delivered[i].keys[scan / 8] &= !bit;", new = "let _ = bit;", fail = "incorrect old-window release" },
    { id = "reuse_window_slot", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "st.win_by_id(rec.window) != Some(i) || ", new = "false || ", fail = "incorrect old-window release" },
    { id = "discard_full_release", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "if !ring::append(st, slot, &ev) { return false; }\n            st.excl.delivered[i].keys", new = "let _ = ring::append(st, slot, &ev);\n            st.excl.delivered[i].keys", fail = "incorrect old-window release" },
    { id = "forget_pointer_buttons", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "rec.buttons = ev.sub;", new = "rec.buttons = 0;", fail = "incorrect old-window release" },
    { id = "repeat_accepted_button", config = "pc98", when = "after_build", replace = "userland/gshell/src/excl.rs", old = "st.excl.delivered[i].buttons &= !bit;", new = "st.excl.delivered[i].buttons |= bit;", fail = "incorrect old-window release" }]
