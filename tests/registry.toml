[[check]]
id = "registry_fields"
spec = { path = "docs/design/tools/checks/registry_v2.md", section = "P4 順 1 の登録" }
subsystem = "infra"
level = "M"
sources = ["tests/registry.toml", "tests/support/registry.py"]
environment = "python"
