[[check]]
id = "pcm_route"
spec = { path = "docs/design/kernel/irq/irq.md", section = "初段の段と受入" }
subsystem = "sound"
level = "L2"
sources = ["sys/dev/sound/cs4231", "sys/hal/sound", "sys/dev/dma", "lib/dma_contract.c", "tools/ops/kernel_includes.py", "tests/support/fixtures/pcm_route"]
environment = "linux-x86-cross"
arch = { x86 = ["pc98"] }
needs = []
expect = "選択した IRQ12 または IRQ10 と DMA #1 取得後だけ経路を更新し、PCM 設計（pcm_cs4231.md「状態機械」「advance」「start / close / reclaim」）に従い、初回 start の PI 読み・条件付き解除、close の DRS 待ち中の IRQ/tick 回収、再同期の 3 tick 期限、DRS 解除後の mask・停止証拠・再始動または経路復元を確認する"
limits = "PCM 実入口と 8237 所有表のホスト模型。実機の配線とタイミングは対象外"
gates = ["push", "main"]
mutations = [
 { id = "close_wait_ack", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "release_waiting_drs = 1;", new = "release_waiting_drs = 0;", fail = "close tick missed PI" },
 { id = "extend_resync_wait", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "s_deadline = tick_count + PCM_STOP_TICKS;", new = "s_deadline = tick_count + PCM_STOP_TICKS + 1;", fail = "resync timeout quarantine" },
 { id = "fm_route", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "? PCM_ROUTE_INT41_DMA1 :", new = "? 0x22 :", fail = "codec before route readback" },
 { id = "skip_pi_readback", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "return pcm_read_pi() == 0;", new = "return 1;", fail = "legacy close with PI" },
 { id = "unowned_mask", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "if (pcm_module_dma_acquire(&dma_owned)) {", new = "dma_chan_mask(PCM_DMA_CHAN, &dma_owned); if (pcm_module_dma_acquire(&dma_owned)) {", fail = "other owner mask" },
 { id = "mask_without_owner", config = "pc98", when = "after_build", replace = "sys/dev/dma/dma8237.c", old = "if (!owner || channel_owner[ch] != owner) {\n        irq_restore(flags);\n        return;\n    }\n    outp(DMA8237_MASK1, dma_mask_byte(ch, 1));", new = "outp(DMA8237_MASK1, dma_mask_byte(ch, 1));", fail = "other owner mask" },
 { id = "reuse_quarantined", config = "pc98", when = "after_build", replace = "sys/dev/dma/dma8237.c", old = "change_owner(ch, owner, &quarantined)", new = "change_owner(ch, owner, 0)", fail = "DMA quarantine ownership" },
 { id = "ignore_release_error", config = "pc98", when = "after_build", replace = "sys/hal/sound/snd2_stream.c", old = "if (opened && d->be->hw_release(d->ctx, leak) < 0) leak = 1;", new = "if (opened) d->be->hw_release(d->ctx, leak);", fail = "HAL close lost restore failure" },
 { id = "early_restore", config = "pc98", when = "after_build", replace = "sys/dev/sound/cs4231/pcm_cs4231.c", old = "while (!pcm_ready(PCM_OP_WAIT_DRS))", new = "while (0)", fail = "DRS deadline" }]

