[[check]]
id = "ppc_media_build"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§0 最小 workflow と仮の関門" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:iso"]
environment = "linux-ppc-cross"
arch = { ppc = ["core", "link", "sh", "link-sh", "shell", "neg1"] }
needs = []
expect = "ビルド成功、PPCKERN.ELF と boot.iso が非空"
limits = "起動到達と再生成時の一致は別の検査"
gates = ["push", "main"]
mutations = [{ id = "ppc_core_missing_iso", config = "core", when = "after_build", remove = "build/out/ppc-kboot/boot.iso", fail = "missing boot.iso" }]

[[check]]
id = "x86_media_build"
spec = { path = "docs/design/tools/checks/tests_v2.md", section = "配布物と再生成の合否" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:kernel-r1", "make:deploy-u3", "make:iso"]
environment = "linux-x86-cross"
arch = { x86 = ["pc98"] }
needs = []
expect = "PC-98 配布物が揃い FD と HostDrv が同じカーネルを持つ"
limits = "起動は別の検査"
gates = ["push", "main"]
mutations = [{ id = "x86_missing_iso", config = "pc98", remove = "images/os32_install.iso", fail = "missing os32_install.iso", when = "after_build" }]

[[check]]
id = "ppc_common_compile"
spec = { path = "docs/design/tools/checks/tests_v2.md", section = "配布物と再生成の合否" }
subsystem = "infra"
level = "L1"
sources = ["make:common-compile"]
environment = "linux-ppc-cross"
arch = { ppc = ["link-sh"] }
needs = []
expect = "共通の各入力が PowerPC の再配置可能 ELF を生成する"
limits = "リンクと起動は保証しない"
gates = ["push", "main"]
mutations = [{ id = "common_missing_object", config = "link-sh", remove = "build/out/ppc-kboot/link-sh/sys/kern/mm/dma_pool.o", fail = "missing dma_pool.o", when = "after_build" }]

[[check]]
id = "build_identity"
spec = { path = "docs/design/tools/checks/tests_v2.md", section = "配布物と再生成の合否" }
subsystem = "infra"
level = "L1"
sources = ["make:all", "make:kernel-r1", "make:deploy-u3", "make:iso"]
environment = "linux-cross"
arch = { x86 = ["pc98"], ppc = ["core", "link", "sh", "link-sh", "shell", "neg1"] }
needs = []
expect = "同じ入力から再生成した生成物の集合とバイトが一致する"
limits = "時刻を含む PowerPC 媒体と root_image_blob.o は存在だけを確認"
gates = ["main"]
mutations = [{ id = "ppc_changed_elf", config = "core", append = "build/out/ppc-kboot/PPCKERN.ELF", fail = "different artifacts: build/out/ppc-kboot/PPCKERN.ELF", when = "after_build" }]

[[check]]
id = "registry_fields"
spec = { path = "docs/design/tools/checks/registry_v2.md", section = "P4 順 1 の登録" }
subsystem = "infra"
level = "M"
sources = ["tests/registry.toml", "tests/support/registry.py"]
environment = "python"
arch = { host = ["local"] }
needs = []
expect = "登録が通り、必須の欄を欠く登録を lint が拒否する"
limits = "製品の実行結果は調べない"
gates = ["push", "main"]
mutations = [{ id = "lint_accepts_missing", config = "local", replace = "tests/support/registry.py", old = "missing = FIELDS", new = "row.setdefault('needs', [])\n        missing = FIELDS", fail = "missing field not rejected: needs", when = "after_build" }]

[[check]]
id = "ppc_boot"
spec = { path = "docs/design/tools/checks/tests_v2.md", section = "PowerMac の起動到達点" }
subsystem = "system"
level = "L4"
sources = ["make:all", "make:iso"]
environment = "qemu-ppc"
arch = { ppc = ["core", "link", "sh", "link-sh", "shell", "neg1"] }
needs = []
expect = "各媒体が設計のシリアル到達点に達し neg1 は期待した例外で停止する"
limits = "QEMU mac99 の起動到達まで"
gates = ["push", "main"]
mutations = [{ id = "boot_wrong_config", config = "core", replace = "boot-serial.log", old = "KBOOT READY stage=pre-user", new = "KBOOT HALTED", fail = "boot did not reach KBOOT READY", when = "after_build" }]

[[check]]
id = "collection_contract"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§2 共通入口" }
subsystem = "infra"
level = "M"
sources = ["tests/infra/ci.py"]
environment = "python"
arch = { host = ["local"] }
needs = []
expect = "独立した失敗の後も全件を集計し、欠落と禁じた再利用を拒む"
limits = "ローカルの実行器・集計器まで"
gates = ["push", "main"]
mutations = [{ id = "allow_reuse", config = "local", replace = "tests/infra/ci.py", old = 'allowed = ("PASS", "FAIL",', new = 'allowed = ("REUSED", "PASS", "FAIL",', fail = "REUSED must be rejected", when = "after_build" }]

[[check]]
id = "landing_evidence"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§8 取り込み SHA の固定" }
subsystem = "infra"
level = "M"
sources = ["tools/ci/land_gate.py"]
environment = "python-yaml"
arch = { host = ["local"] }
needs = []
expect = "候補 SHA の指定 run の最新 attempt の成功と両機種の今回の起動記録が揃う"
limits = "API 応答を与えた関門の判定。媒体自体の起動は別の検査"
gates = ["push", "main"]
mutations = [
    { id = "accept_stale_attempt", config = "local", replace = "tools/ci/land_gate.py", old = "or number(run['run_attempt']) != attempt", new = "or False", fail = "invalid run_attempt accepted", when = "after_build" },
    { id = "accept_partial_boot", config = "local", replace = "tools/ci/land_gate.py", old = "if machines != {'pc98', 'powermac'}:", new = "if not machines:", fail = "missing PowerMac boot accepted", when = "after_build" },
]

[[check]]
id = "src_owner"
spec = { path = "docs/design/build/ownership.md", section = "追跡パスの所有と配置" }
subsystem = "infra"
level = "L0"
