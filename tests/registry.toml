[[check]]
id = "collection_contract"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§2 共通入口" }
subsystem = "infra"
level = "M"
sources = ["tests/infra/ci.py", "tests/support/impact.py", "tools/ownership_images.py", "tests/support/registry.py", ".github/workflows/restructure-build.yml", ".github/workflows/restructure-check-bundle.yml", "tests/registry.toml"]
environment = "python-yaml"
arch = { host = ["local"] }
needs = []
expect = "変更ファイルが入る宣言済みの像と仕様文書を読む検査を選び、独立した失敗の後も全件を集計し、欠落と禁じた再利用を拒む"
limits = "ローカルの実行器・集計器まで"
gates = ["push", "main"]
mutations = [{ id = "allow_linked_root", config = "local", replace = "tests/infra/ci.py", old = "if destination.is_symlink():", new = "if destination.is_symlink() and destination.parent != output:", fail = "accepted linked component evidence", when = "after_build" },
             { id = "allow_linked_row", config = "local", replace = "tests/infra/ci.py", old = "if destination.is_symlink():", new = "if destination.is_symlink() and component != name:", fail = "accepted linked component evidence/first", when = "after_build" },
             { id = "omit_evidence_upload", config = "local", replace = ".github/workflows/restructure-check-bundle.yml", old = "/results/evidence/", new = "/results/absent/", fail = "failure evidence upload missing", when = "after_build" },
             { id = "omit_net_image", config = "local", replace = "tests/support/impact.py", old = "row[\"environment\"].startswith(\"qemu-ppc\")", new = "row[\"environment\"] == \"qemu-ppc\"", fail = "net fixture image selection", when = "after_build" },
             { id = "forward_red", config = "local", replace = "tests/infra/ci.py", old = "if result != \"RED\" else None", new = "if True else None", fail = "expected RED forwarded", when = "after_build" },
             { id = "first_missing_only", config = "local", replace = "tests/infra/ci.py", old = 'raise MissingPrerequisites("\n".join(sorted(missing)))', new = 'raise MissingPrerequisites("\n".join(sorted(missing)[:1]))', fail = "missing prerequisites incomplete", when = "after_build" },
             { id = "drop_userland_check", config = "local", replace = "tests/support/impact.py", old = '{"ring3_instructions", "c_dialect",', new = '{"c_dialect",', fail = "userland checks", when = "after_build" },
             { id = "drop_declared_configs", config = "local", replace = "tests/support/impact.py", old = "declared_configs.update(config for config, _ in outputs)", new = "declared_configs.clear()", fail = "declared images:", when = "after_build" },
             { id = "drop_spec_input", config = "local", replace = "tests/support/impact.py", old = 'direct.add("test_registration")', new = "pass", fail = "spec input:", when = "after_build" },
             { id = "drop_shared_program", config = "local", replace = "tests/support/impact.py", old = "if shared_programs:", new = "if False:", fail = "shared program inputs", when = "after_build" },
             { id = "allow_reuse", config = "local", replace = "tests/infra/ci.py", old = 'allowed = ("PASS", "FAIL",', new = 'allowed = ("REUSED", "PASS", "FAIL",', fail = "REUSED must be rejected", when = "after_build" }]

[[check]]
id = "landing_evidence"
spec = { path = "docs/design/tools/ci/ci_v2.md", section = "§8 取り込み SHA の固定" }
subsystem = "infra"
level = "M"
sources = ["tools/ci/land_gate.py", "tools/ci_fetch.sh", "tests/support/impact.py"]
environment = "python-yaml"
arch = { host = ["local"] }
needs = []
expect = "候補 SHA の指定 run の最新 attempt の成功と両機種の今回の起動記録が揃う"
limits = "API 応答を与えた関門の判定。媒体自体の起動は別の検査"
gates = ["push", "main"]
mutations = [
    { id = "accept_failed_summary", config = "local", replace = "tools/ci/land_gate.py", old = 'or summary["rc"] != 0', new = 'or False', fail = "invalid summary rc accepted", when = "after_build" },
    { id = "accept_built", config = "local", replace = "tools/ci/land_gate.py", old = 'if sum(row["name"] == marker and not row["expired"] for row in artifacts) != 1:', new = "if False:", fail = "BUILT accepted for landing", when = "after_build" },
    { id = "accept_stale_attempt", config = "local", replace = "tools/ci/land_gate.py", old = "or number(run['run_attempt']) != attempt", new = "or False", fail = "invalid run_attempt accepted", when = "after_build" },
    { id = "accept_failed_selftest", config = "local", replace = "tools/ci/land_gate.py", old = "if type(count) is not int or count != 0:", new = "if False:", fail = "invalid PC-98 selftest count accepted", when = "after_build" },
    { id = "require_fd_selftest", config = "local", replace = "tools/ci/land_gate.py", old = "if kind == 'hdd':", new = "if True:", fail = "PC-98 requires selftest_fail=0", when = "after_build" },
    { id = "accept_fd_for_distribution", config = "local", replace = "tools/ci/land_gate.py", old = "('distribution', 'hdd'), ('fd', 'fd')", new = "('distribution', 'hdd'), ('distribution', 'fd'), ('fd', 'fd')", fail = "FD accepted for distribution", when = "after_build" },
    { id = "ignore_fd_commit", config = "local", replace = "tools/ci/land_gate.py", old = "or not run['head_sha'].startswith(commit)", new = "or False", fail = "wrong FD Commit accepted", when = "after_build" },
    { id = "accept_partial_boot", config = "local", replace = "tools/ci/land_gate.py", old = "if machines != required:", new = "if not machines:", fail = "missing PowerMac boot accepted", when = "after_build" },
]

