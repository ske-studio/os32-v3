      tags: [test]
    # --- pcm_test (票 TASK_PCM_CS4231 §3 E3 / E5: CS4231 再生の CPL=3 受入。
    #     左 = 1kHz 正弦 / 右 = frame 番号なので、採った PCM から左右の
