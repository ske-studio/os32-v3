# ============================================================================
#  userland/deploy.yaml — 標準ユーザーランドの配備定義
#
#  シェル、コマンド、標準アプリ、テスト、man ページ、および OS 側の
#  アセット (フォント / FEP 辞書 / filetypes / profile)。
#
#  ここに載せ忘れたバイナリは NHD 上で古いまま残る。KAPI レイアウトが
#  変わると旧バイナリの KAPI 呼び出しが別関数へ飛び、exit 後の jmp $ で
#  永久スピンして rshell ごと沈黙する。make check-manifests で検査できる。
#
#  **tags: は CD のパッケージの振り分けも決める** (build/packages.yaml、
#  tools/mkpkg.py --plan)。core / base → MINIMAL、gui → GUI、
#  programs / docs / data → NORMAL、test → DEBUG。MINIMAL は FD の中身と同じ
#  集合 (FD も同じ構成から作る。core / base に足すと FD にも入る)。userland/tests/ 由来の行は必ず [test] にする (make
#  check-packages-host が検査する)。行ごとにタグは 1 つ。
# ============================================================================

filesystem:
  files:
    # --- シェル (カーネルは /shell をロードする: config.h SYS_SHELL_BIN) ---
    - host: userland/shell.bin
      guest: /sys/shell.bin
      tags: [core]
    # --- sh (常駐シェルと同じソースの CPL=3 版、端末から起動する。票 T9 D1) ---
    - host: userland/sh.bin
      guest: /bin/
      tags: [programs]
    # --- GUI シェル (WM 常駐、config.h SYS_GSHELL_BIN、K4 の起動ループが読む) ---
    #     GUI.PKG (タグ gui)。Minimal だけの導入では無く、system.cfg の GUI=1 でも
    #     カーネルが "gshell load failed -> CUI shell" で CUI に落ちる
    - host: userland/gshell.bin
      guest: /bin/gshell.bin
      tags: [gui]
    # --- GUI 共有ライブラリ (0x400000 常駐、config.h SYS_SHLIB_GUI、K3 のローダが起動時に読む) ---
    - host: userland/libos32gui.shlib
      guest: /sys/lib/libos32gui.shlib
      tags: [gui]
    # --- システム管理プログラム → /sbin/ ---
    - host: userland/system/install.bin
      guest: /sbin/
      tags: [base]
    - host: userland/tests/crash.bin
      guest: /sbin/
      tags: [test]
    - host: userland/tests/bench.bin
      guest: /sbin/
      tags: [test]
    - host: userland/tests/restest.bin
      guest: /sbin/
      tags: [test]
    # 終了コードを返すだけの試験バイナリ (票 TASK_EXIT_STATUS §4-2)。
    # **/usr/bin ではなく /sbin に 1 本だけ**置く — 受入 S2b が
    # 「1 コピーで実行回数 1」を数えるので、2 か所に置かない。
    - host: userland/tests/t_exit.bin
      guest: /sbin/
      tags: [test]
    - host: userland/system/cdinst.bin
      guest: /sbin/
      tags: [base]
    # hsync は base (MINIMAL = 起動 FD)。MINIMAL で入れた機械が後から残りを
    # 取ってこられるように (2026-09-25、MINIMAL = レスキュー兼インストーラ)。
    # 同期元は /host (HostDrv) なので、今は NP21/W の上でだけ役に立つ
    - host: userland/system/hsync.bin
      guest: /sbin/
      tags: [base]
    - host: userland/tests/bench_scale2x.bin
      guest: /usr/bin/
      tags: [test]
    - host: userland/tests/gfx200_test.bin
