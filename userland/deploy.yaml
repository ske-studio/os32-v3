    - host: userland/tests/sqlite_standalone/sqlite_standalone.bin
      guest: /usr/bin/sqlite_standalone.bin
      tags: [test]
    # --- LZ4 圧縮/展開コマンド → /bin/ ---
    - host: userland/system/lz4.bin
      guest: /bin/lz4.bin
      tags: [programs]
    # --- サウンド制御/テスト → /bin/ ---
    # deploy.yaml に無いバイナリは NHD 上で stale 化し、KAPI レイアウトが
    # 変わった時に旧バイナリが別関数へ飛んでハングする (2026-08-13 実測)。
    # PKG 配布物でも起動対象になるものは必ずここに載せること。
    - host: userland/system/sndctl.bin
      guest: /bin/sndctl.bin
      tags: [programs]
    - host: userland/system/sndtest.bin
      guest: /bin/sndtest.bin
      tags: [programs]
    - host: userland/system/sndtest2.bin
      guest: /bin/sndtest2.bin
      tags: [programs]
    # --- MINIMAL のコマンド (タグ base → CD の MINIMAL = 起動 FD) ---
    # MINIMAL は「起動して、HDD に入れて、壊れたときに直して、残りを取ってこられる」
    # レスキュー兼インストーラ (2026-09-25、ユーザー決定)。ここに挙げるのは直すときに
    # 中身を見る less / grep / hexdump と設定を直す cfg だけ (install / cdinst / hsync は
    # /sbin の行)。more / find / sort / head / tail / wc / tee / touch / sleep / diff / du /
    # cal / man は下の glob (programs = NORMAL) に入る。2HD の起動 FD の空きのため
    # (docs/08_build.md の「起動 FD と MINIMAL」)。
    # 下の glob から exclude: で外し、ここで 1 本ずつ挙げる。足すときは両方直す
    # (両方に残れば make check-packages-host がゲストパスの重複で、両方から
    # 消えれば make check-manifests の 3 が「配備に無いバイナリ」で知らせる)。
    - host: userland/cmds/less.bin
      guest: /bin/less.bin
      tags: [base]
    - host: userland/cmds/grep.bin
      guest: /bin/grep.bin
      tags: [base]
    - host: userland/cmds/hexdump.bin
      guest: /bin/hexdump.bin
      tags: [base]
    - host: userland/cmds/cfg.bin
      guest: /bin/cfg.bin
      tags: [base]
    # --- 一般プログラム → /bin/ ---
    - host: "userland/cmds/*.bin"
      guest: /bin/
      type: glob
      exclude:
        - less.bin  # base (上で個別)
        - grep.bin  # base (上で個別)
        - hexdump.bin  # base (上で個別)
        - cfg.bin  # base (上で個別)
        - shell.bin
        - install.bin
        - cdinst.bin
        - crash.bin
        - bench.bin
        - restest.bin
        - edit.bin
        - gfx_demo.bin
        - demo1.bin
        - ekakiuta.bin
        - vbzview.bin
        - vdpview.bin
        - mgxview.bin
        - spr_test.bin
        - raster.bin
        - mdview.bin
      tags: [programs]
    # --- マニュアルページ → /usr/man/ ---
    - host: "docs/manpages/*.1"
      guest: /usr/man/
      type: glob
      tags: [docs]
    # --- ファイルタイプ関連付け ---
    - host: assets/filetypes
      guest: /etc/filetypes
      tags: [core]
    # --- 設定レジストリの初期値 (正典 tsv。DB は媒体だけが持つ、票 S0-T) ---
    - host: assets/settings/defaults.tsv
      guest: /etc/settings.tsv
      tags: [core]
    # --- 版 2 の試験 fixture (票 S4 G5)。保護対象でない名前で置き、ゲストで
    #     `cp /etc/settings.v2.fixture /etc/settings.db` して VERSION 状態を作る ---
    - host: build/out/settings.v2.fixture
      guest: /etc/settings.v2.fixture
      tags: [test]
    # --- FEP辞書 (SQLite DB) ---
    - host: assets/fep.db
      guest: /db/fep.db
      tags: [data]
    # --- テスト用ファイル ---
    - host: userland/tests/data/test.txt
      guest: /home/user/test.txt
      tags: [test]
    - host: userland/tests/data/test_utf8.txt
      guest: /home/user/test_utf8.txt
      tags: [test]
    - host: userland/tests/data/test_pager.txt
      guest: /home/user/test_pager.txt
      tags: [test]
    - host: userland/tests/data/test_script.bat
      guest: /home/user/test_script.bat
      tags: [test]
    - host: userland/tests/data/hello.sh
      guest: /test/hello.sh
      tags: [test]

    # --- ビットマップフォント (KCG キャッシュ形式) ---
    # カーネルが起動時に /sys/font/default.kcgfont を読む
    # (kernel.c の kcg_load_font)。tools/gen_font16.py で生成する。
    # **data (NORMAL)。MINIMAL と起動 FD には入れない** (ユーザー決定 2026-09-25)。
    # 無くても起動は止まらない — 画面に `FONT..NG` と `[KCG] kernel-init load
    # failed: -1` が出て、漢字・ANK は本体のフォント ROM から読む (drivers/kcg.c。
    # テキスト画面の文字は元から ROM)。184KB あり、入れていたころは 2HD の FD が
    # カーネルの 4KB 増で溢れた (docs/08_build.md の「起動 FD と MINIMAL」)。
    # FD (FAT) に置くなら 8.3 の /sys/font/default.kcg (kernel/boot_font.c)。
    - host: assets/fonts/ipaexg16.kcgfont
      guest: /sys/font/default.kcgfont
      tags: [data]
    # --- TrueType フォントは配らない (ユーザー決定 2026-09-30) ---
    # 日本語 OpenType は配布物に同梱せず、使う人が assets/fonts/ipaexg.ttf を
    # hsync などで /data/ipaexg.ttf に置く (font_test が読む)。サブセット TTF は廃止。
    # --- フォントテスト ---
    - host: userland/tests/font_test.bin
      guest: /usr/bin/
      tags: [test]
    # --- GUI デモ (libos32gui) ---
    - host: userland/tests/gui_demo.bin
      guest: /usr/bin/
      tags: [test]
    # --- GUI v1.2 client API 試験 (C4: modal_result / session_launch / icon16) ---
    - host: userland/tests/v12_api_test.bin
      guest: /usr/bin/
      tags: [test]
    # --- 端末アプリ (K6C-A: con_sink を吸って端末窓に描く) ---
    - host: userland/tests/t5a_display.bin
      guest: /usr/bin/
      tags: [test]
    # --- GUI v1.2 File Manager (C5、Start → File Manager が起動する) ---
    - host: userland/system/filer.bin
      guest: /usr/bin/
      tags: [gui]
    # --- GUI v1.4 テキストエディタ (票 TASK_EDIT_GUI)。CUI 版 edit とは別物 ---
    - host: userland/system/edit_gui.bin
      guest: /usr/bin/
      tags: [gui]
    # --- GUI v1.4 About OS32 (Start → Programs の about.bin) ---
    - host: userland/system/about.bin
      guest: /usr/bin/
      tags: [gui]
    # --- GUI G1 ゲート描画テスト (libos32gui) ---
    - host: userland/tests/gdi_test.bin
      guest: /usr/bin/
      tags: [test]
    # --- GUI C2: パレットリース検証 (W2) と入力→表示の測定器 (契約 P2) ---
    - host: userland/tests/lease_test.bin
      guest: /usr/bin/
      tags: [test]
    - host: userland/tests/gui_bench.bin
      guest: /usr/bin/
      tags: [test]
    - host: userland/tests/font_load_test.bin
      guest: /usr/bin/
      tags: [test]
