# gshell — OS32 GUI シェル (ウィンドウマネージャ本体、票 W1)
#
# シェル帯 (MEM_SHELL_LOAD_ADDR, CPL=0) に常駐する WM。shell.bin と排他 (契約 T9)。
# userland/rust/ ワークスペースの外 (userland/gshell/) に置くため、
# 自前の独立ワークスペースとして立てる。ビルドは PM が build/programs.mk に
# 登録する (app_sys.ld の shell 帯へ crt0 + libos32gfx とリンク)。
#
# 依存の鉄則 (TASKS §6 / v2 C8):
#   - 外部クレート (crates.io) は一切追加しない。in-repo の os32api と os32-font のみ。
#   - no_std / panic=abort。状態は固定長配列 (alloc 不使用)。
#   - 描画は libos32gfx を FFI (os32api::gfx) で呼ぶ。Rust で再実装しない。
[package]
name = "gshell"
version = "0.1.0"
edition = "2021"
description = "OS32 GUI shell / window manager (resident shell band, CPL=0)"

[lib]
# staticlib: crt0 + libos32gfx.a と最終リンクして /bin/gshell.bin を作る。
crate-type = ["staticlib"]

[features]
# T7b-b2 b2③ のゲスト fixture (src/fixture.rs)。製品 build には入れない —
# `make gshell GSHELL_FEATURES=r1_fixture` のときだけ (build/programs.mk)。
r1_fixture = []

[dependencies]
# in-repo クレートのみ。os32api が KernelAPI バインディング / GUI 共有定義
# (os32api::gui::proto) / libos32gfx の extern "C" 宣言 / panic_handler /
# global_allocator を単一実体で供給する。
os32api = { path = "../../sdk/rust/os32api" }
# T7b-b3 S3: 製品の字形 engine (reader / raster / glyph cache)。no_std・heap 無し、
# in-repo (ttf-parser は crate 内の vendor)。x87 を使う open/raster は kernel の
# font_guard_run (service 表 v2) の callback の中でだけ呼ぶ (src/font.rs)。
os32-font = { path = "../lib/font" }

# gshell 自身を独立ワークスペースにして userland/rust の workspace に
# 吸われないようにする (userland/rust は別ディレクトリツリー)。
[workspace]

[profile.release]
opt-level = 2
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
