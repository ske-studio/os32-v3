# v12_api_test — GUI v1.2 デスクトップ client API (票 C4) の実機確認アプリ
#
# MODAL_RESULT / File Open / Input / SESSION_REQUEST / Icon16 を 1 本で試す。
# gui_demo と同じ構成: os32api の panic_handler / global_allocator を単一実体で
# 取り込むため、このクレートだけが staticlib (最終リンク対象) になる。
[package]
name = "v12_api_test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
os32api = { path = "../../../sdk/rust/os32api" }
# 票 C3: 本体は 0x400000 常駐の共有ライブラリ。アプリはスタブだけをリンクする。
libos32gui = { path = "../libos32gui_stub", package = "libos32gui_stub" }
