# about — 「About OS32」ダイアログ (/usr/bin/about.bin、ROADMAP v1.4 の About dialog)
#
# filer / edit_gui と同じ構成: os32api の panic_handler / global_allocator を単一実体で
# 取り込むため、このクレートだけが staticlib (最終リンク対象) になる。
[package]
name = "about"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
os32api = { path = "../../../sdk/rust/os32api" }
# 票 C3: 本体は 0x400000 常駐の共有ライブラリ。アプリはスタブだけをリンクする。
libos32gui = { path = "../libos32gui_stub", package = "libos32gui_stub" }
