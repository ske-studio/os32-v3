# tools/check_map.yaml — 検査 → 入力のパス (glob) の対応表 (make check-changed)
#
# check-changed の絞り込みは**作業中の近道 (目安)** で、取りこぼしの保証はしない。保証は
# 取り込み (PM) の `make check` (全部を変異込み) が担う。そのため絞り込みの型は保守的な
# 許可リストにとどめ、わざと作った入力への耐性は目標にしない (ユーザー承認 2026-10-01)。
#
# 読むのは tools/check_select.py。規則はそこの docstring と docs/08_build.md §8-4:
#   * 変更が checks: の glob に当たった検査 → 変異込み、当たらなかった検査 → 変異なし
#   * full: に当たる変更、または どの glob にも docs_only: にも notest: にも当たらない
#     変更 → 全部を変異込み (= make check)。表の漏れで否定側を落とさないための安全側。
#     例外: Makefile / build/*.mk は「新しい試験を足す形」だけを決まった型との完全一致で
#     絞る (基点 = merge-base 版との差分が追加だけで、足した行が全部 型 — 列への検査名、
#     `check-<name>:` の新しい規則、`python3 -B tools/tests/<file>.py [--flag] [$(MUT)]`
#     の recipe 行、コメント・空行 — に一致し、既存の規則と recipe の間に挟まず、列の
#     位置も動かさないときだけ。新しい検査と行を足した検査を変異込み)。それ以外の差分・--files は全部 (docs/08_build.md §8-4)。make は
#     呼ばない。sdk/kapi.json は生成物を介するので全部のまま。
#     broad: の検査の `**` glob はこの判定に数えない
#   * 変更が全部 docs_only: に当たる → 当たった検査 + docs_always: だけを回す
#   * notest: (どのホスト試験の入力でもない場所) の変更は何も足さない。それだけなら
#     全部を変異なし (= check-fast)。検査の glob に当たればそちらが勝つ
#   * ignore: に当たるものは変更に数えない
# glob: `**` はディレクトリを跨ぐ、`*` `?` は跨がない。`[ch]` などの文字集合可。
#
# **表の漏れは make check-map が見る**: 各検査の recipe から辿れる試験スクリプトが
# 開く / #include する (C は場所を問わず "..." を多段に、取り込む側の場所・ROOT・
# 試験が渡す -I の探索先で解決) / #[path] で取り込むソースが、その検査の glob (または full:)
# に入っていること。拾えた入力が notest: に当たっても落ちる (notest の番人)。静的に拾えない入力 (os.walk で舐める検査器・rustc に渡す
# ディレクトリ) は glob を手で広く書く (各検査の先頭の行)。
# 新しい検査を列 (build/sdk.mk の CHECK_PAR_TARGETS) に足したら
# `python3 tools/check_select.py --suggest <検査名>` の出力を下書きにしてここへ足す。
# 初版は 2026-09-26 (--suggest の出力 + 走査型の検査器の手書き glob)。

ignore:
  - docs/hw
  - docs/hw/**
  - .claude/**

# ここに当たる変更は全部を変異込み。ただし build/*.mk の検査だけの変更は上記の例外。
full:
  - Makefile
  - build/*.mk
  - sdk/kapi.json

# 文書だけの変更。全部がここに当たれば、当たった検査 (文書系) だけを回す。
docs_only:
  - "**/*.md"
  - docs/.orphans-allow
  - docs/images/**
  - docs/logs/**

# 走査型の検査。ここに名のある検査の `**` を含む glob は「表に載っている」の判定に
# 数えない (ツリーを丸ごと舐める glob に当たっただけで「表に無い → 全部変異」の
# 安全側が発火しなくなるのを防ぐ)。変異込みで回す検査を選ぶ方には数える。
broad:
  - check-p2v
  - check-c-dialect
  - check-c-dialect-host
  - check-arch-asm
  - check-privileged
  - check-le-access
  - check-docs-links
  - check-docs-orphans
  - check-docs-status
  - check-docs-status-host
  - check-tests-inventory
  - check-manifests
  - check-packages-host

# 文書を読む検査。docs だけの変更のときは、glob に当たらなくても必ず回す
# (表の漏れで文書の検査を落とさない。どれも数秒以内)。
docs_always:
  - check-constraints
  - check-kapi-version
  - check-manifests
  - check-packages-host
  - check-tests-inventory
  - check-docs-links
  - check-docs-orphans
  - check-docs-status
  - check-docs-status-host
  - check-memmap

# どのホスト試験の入力にもならない場所 (2026-09-26)。ここだけに当たる変更は
# 「表に無い → 全部変異込み」の安全側に落とさず、全部を変異なしで回す
# (= check-fast)。検査の glob に当たる変更はそちらが勝つ (走査型の検査の
# ** glob に当たれば、その検査は変異込みになる)。
# **番人**: make check-map (--lint) は、各検査の recipe から静的に拾えた入力が
# ここに当たると「notest なのに入力になっている」と言って落ちる。試験が読む
# ようになったら except: に足すか項目を外す。静的に拾えない読み方 (os.walk、
# "%s.c" % 名前 のような組み立て) をする試験の入力は、その検査の glob に書いて
# あること (glob が勝つので安全) を足す前に確かめる。
# 足す前の確かめ方: tools/ と tools/tests/ の試験スクリプト・ハーネスがその場所の
# ファイル名・ディレクトリ名を文字列で持っていないこと (grep)。
notest:
  # 外部コマンド。ホスト試験が読むのは cfg.c (test_cfg)、wget / lpr / hclip /
  # hdate (test_host_lib)、stat.c / tar.c (check-tools-host) だけ。
  # userland/** を舐める check-privileged / check-manifests は ** glob で当たる。
  - glob: userland/cmds/**
    except:
      - userland/cmds/cfg.c
      - userland/cmds/hclip.c
      - userland/cmds/hdate.c
      - userland/cmds/lpr.c
      - userland/cmds/stat.c
      - userland/cmds/tar.c
      - userland/cmds/wget.c
  # man ページ。hsync.1 は test_hsync_h2 / test_h4_manifest が読む。
  # check-manifests / check-packages-host は docs/manpages/** で当たる。
  - glob: docs/manpages/*.1
    except:
      - docs/manpages/hsync.1

