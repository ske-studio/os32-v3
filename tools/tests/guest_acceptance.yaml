  contract: docs/tasks/v3/TASK_T2D_T2H.md#4-2-状態と配送契約
  mode: manual
  prereq: 17MB, current ini。構成依存の 8MB planar/PEGC・音源・Cirrus・Ra266 は T2h H-4。17MB で達せる観測はここで実施。
  entry: 'G-3と同じ（g3fix 後の trim_front を使用し、対象確保前に自身のリングを空にする）。C/Rust 両 back へ a、front で対象確保。'
  observe:
  - '最新 kernel.map: appslot_trim_{epoch,request_count,mark_count,done_count,done_reject_count,pages_total}, ring3_stop_park_count,
    appslot_reclaim_count, exec_as_leftover_pages, ledger_bad_free/retire_refused/claim_refused'
  - '最新 gshell ELF: gshell_trim_delivered, gshell_trim_skipped_full, trim::SENT; MemStat 132B の trim_pending_mask
    と各 slot の trim_pending/trim_epoch'
  - fixture 出力と終了行、区間前後のカウンタ差分。配備 binary のサイズ/SHA256 を照合
  expect:
    counters: G-3と同じ（g3fix 後の trim_front による観測）
    front: G-3と同じ（g3fix 後の trim_front の出力と終了値）
    rust: DATA OK、hook_calls=1、LARGE=0。hook hint は0、物理ページはDONEで返る
  evidence: ~/os32-tmp/evidence/<日付>/g-R-2/
- id: g-R-3
  gate: GK-4
  contract: docs/tasks/v3/TASK_T2D_T2H.md#4-2-状態と配送契約
  mode: manual
  prereq: 17MB, current ini。構成依存の 8MB planar/PEGC・音源・Cirrus・Ra266 は T2h H-4。17MB で達せる観測はここで実施。
  entry: G-4をRust backでも観測。次の通常イベントまたは o で DONE/G-4 行を出し、観測後 r は1回だけで障害物 unmap → EXACT regrow、その後 q。2回目の r は bad で終了値1。regrow が EXACT にならず FAIL したら、ARENA1 の端数（末尾72B以内）を疑う。
  observe:
  - '最新 kernel.map: appslot_trim_{epoch,request_count,mark_count,done_count,done_reject_count,pages_total}, ring3_stop_park_count,
    appslot_reclaim_count, exec_as_leftover_pages, ledger_bad_free/retire_refused/claim_refused'
  - '最新 gshell ELF: gshell_trim_delivered, gshell_trim_skipped_full, trim::SENT; MemStat 132B の trim_pending_mask
    と各 slot の trim_pending/trim_epoch'
  - fixture 出力と終了行、区間前後のカウンタ差分。配備 binary のサイズ/SHA256 を照合
  expect:
    tail: ARENA1 cur_end 減を別記録
    whole: ARENA 2->1 を別記録
    initial: INITIAL不変、DATA OK、LARGE=0
    obstacle: rc=0、1ページはtrim pagesに含めない
    regrow: regrow ok rc=0 ... EXACT、cur +65536、ARENA=1
    exit: rc=0、RETRY_COUNT/RETRY_OK_COUNT/RETRY_HOOK_PAGES を記録、hook_calls=1、CRC=OK、regrow rc=0、pages>0。未実施はrc=1
  evidence: ~/os32-tmp/evidence/<日付>/g-R-3/
- id: g-R-4
  gate: GK-4
  contract: docs/tasks/v3/TASK_T2D_T2H.md#4-2-状態と配送契約
  mode: manual
  prereq: 17MB, current ini。構成依存の 8MB planar/PEGC・音源・Cirrus・Ra266 は T2h H-4。17MB で達せる観測はここで実施。
  entry: trim_back_rs --stop-focus --slow-hook 300 を使用。trim_back_rs focus ok の後、STOP の前に front_owner/abort_target が Rust back であることを確かめ、hook中に CTRL+STOP（G-7相当）。別試行でDONE直後にも同じ宛先確認をしてSTOP。
  observe:
  - '最新 kernel.map: appslot_trim_{epoch,request_count,mark_count,done_count,done_reject_count,pages_total}, ring3_stop_park_count,
    appslot_reclaim_count, exec_as_leftover_pages, ledger_bad_free/retire_refused/claim_refused'
  - '最新 gshell ELF: gshell_trim_delivered, gshell_trim_skipped_full, trim::SENT; MemStat 132B の trim_pending_mask
    と各 slot の trim_pending/trim_epoch'
  - fixture 出力と終了行、区間前後のカウンタ差分。配備 binary のサイズ/SHA256 を照合
  expect:
    reclaim_delta: 1
    owner_pages: 0
    stop_park_delta: 1
    slot: trim_pending=0、trim_epoch=0
    mask: 当該 bit=0
    wm: 生存、trim::SENT の該当要素=0
    ledger: bad_free/retire_refused/claim_refused の増分0
  evidence: ~/os32-tmp/evidence/<日付>/g-R-4/
