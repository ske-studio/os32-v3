- id: e9-tvdump
  gate: e9
  contract: docs/tasks/v3/TASK_T2D_T2H.md#2-5-分割試験受入
  mode: tool
  prereq: 17MB, current ini
  entry: python3 tools/tvdump_recv.py --raw <evidence>/tvdump.bin
  observe:
  - /api/cmd raw TVDM
  - /api/tvram lines
  expect:
    cols: 80
    rows: 25
    cell_bytes: 4000
    frame_bytes: 4006
    line_match: true
    scroll_rows_excluded: 1
  evidence: ~/os32-tmp/evidence/<日付>/<case id>/
- id: e10b-pt0
  gate: e10b
  contract: docs/tasks/v3/TASK_T2D_T2H.md#2-5-分割試験受入
  mode: tool
  prereq: 17MB, current ini
  entry:
    snapshot: python3 tools/accept/pt0_snapshot.py <out.json>
    compare: python3 tools/accept/pt0_snapshot.py --compare base.json other.json --ignore-ad
    sequence:
    - application execution
    - baseline
    - v86 -t
    - snapshot
    - v86 -t
    - snapshot
    - v86 -g -t
    - snapshot
  observe:
  - kernel.map observation globals
  - /api/mem physical PDE0 and 256 PT0 PTEs
  expect:
    pte_count: 256
    ignore_pte_bits: 96
    pde0_unchanged: true
    ptes_match: true
    v86_restore_mismatch: 0
    gfx_current_height: 400
    gfx_flip_enabled: 0
  evidence: ~/os32-tmp/evidence/<日付>/<case id>/
