- id: e11a2-fullscreen-input
  gate: e11
  contract: docs/KAPI_SPEC.md
  mode: manual
  prereq: PM integrates e11; deploy matching kernel, gshell and programs; verify ver image and kernel.map; 17MB current ini
  entry: GUI Run hello_gfx with and without another window open; press a key; repeat from terminal; run a WAIT_POLL graphics program (gfx200_test)
  observe:
  - Run child exits on one key; previous window receives neither Key nor Text
  - Terminal child receives one character per make; break sends nothing; no leftover character at shell prompt
  - WAIT_POLL frame EAX contains injected character; empty poll remains -1
  - Keep terminal sh in WAIT_KEY, start fullscreen Y from Run, inject q; only Y receives it and hidden sh remains parked
  - Repeat with fullscreen WAIT_KEY; after its input drains, no repeated empty resume loop
  - Exiting a terminal fullscreen descendant preserves sh typeahead; exiting a WM destination discards only its tagged bytes
  - Record kselftest and run db_test and db_v50_test after return
  expect:
    run_key_exit: true
    terminal_single_injection: true
    background_window_input: 0
    wait_poll_receives_key: true
    hidden_shell_input: 0
    terminal_typeahead_preserved: true
    regression_failures: 0
  evidence: ~/os32-tmp/evidence/<日付>/<case id>/
