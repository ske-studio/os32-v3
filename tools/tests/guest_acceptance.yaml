  - 'shlib_initはbootで1回だけ (kernel/kernel.c:740)。PMが隔離媒体の /sys/lib/libos32gui.shlib に世代2コピーを置いて読み戻しhashを照合しcold boot。現行kernel.elfのnmでg_reject/g_loadedの番地を解決し、実メモリg_reject=SHLIB_REJECT_LAYOUT (1)、g_loaded=0を採る (kernel/shlib.c:18-35, kernel/shlib.h:26)。os32x_layout_checkの戻り値3とは別の状態。ロード済みセッションでファイルを差し替えただけの結果は数えない'
  - 'GUI起動要求で GUI shlib: rebuild required (KAPI data layout) -> CUI shell の画面案内とCPL0 shellへの復帰を確認 (kernel/kernel.c:794-802)。同じv72のgui_demo.binはparse_headerでshlib_protocol=1を確認し、CPL0 shellから起動すると Error: required shared library is not loaded で拒否 (exec/exec.c:963-964, :1767-1773)。この起動の前後でexec_entry_calls/AS資源不変、shell/ver応答を確認。boot全体ではCUI shellが起動するため、そのentryを差に混ぜない'
