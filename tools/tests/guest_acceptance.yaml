    compare: python3 tools/accept/pt0_snapshot.py --compare base.json other.json --ignore-ad
    sequence:
    - application execution
    - baseline
    - v86 -t
    - snapshot
    - v86 -t
    - snapshot
    - v86 -g -t
    - snapshot
  observe:
  - kernel.map observation globals
  - /api/mem physical PDE0 and 256 PT0 PTEs
  expect:
    pte_count: 256
    ignore_pte_bits: 96
    pde0_unchanged: true
    ptes_match: true
    v86_restore_mismatch: 0
    gfx_current_height: 400
    gfx_flip_enabled: 0
