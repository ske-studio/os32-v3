name: restructure-build
on:
  push:
    branches: [main, "wt/**"]
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:
    inputs:
      diag_tick_s1:
        description: Build the Ra266 tick-s1 diagnostic HostDrv image
        type: boolean
        default: false
      kapi_base:
        description: Previous main SHA for a manual main candidate
        type: string
permissions:
  contents: read
concurrency:
  group: restructure-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tick-s1:
    if: github.event_name == 'workflow_dispatch' && inputs.diag_tick_s1
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OS32_ACCEPT_IPA_LICENSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-setup
      - name: Build tick-s1 diagnostic image
        shell: bash
        run: |
          export PATH="$CROSS_DIR/bin:$PATH" TZ=UTC LC_ALL=C
          export OS32_BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make -j"$(nproc)" TICK_PROBE_BUILD=1 all build/out/tickprobe.bin build/out/snd2_test_diag.bin
      - name: Package tick-s1 HostDrv and matching symbols
        shell: bash
        run: |
          export HOSTDRV_DIR="$RUNNER_TEMP/s1-hostdrv"
          package="$RUNNER_TEMP/tick-s1"
          object=obj/sys/platform/pc98/tsc_clock.o
          mkdir -p "$HOSTDRV_DIR" "$package/$(dirname "$object")"
          python3 tools/hostdrv_deploy.py sync
          mkdir -p "$HOSTDRV_DIR/tick"
          cp build/out/{tickprobe,snd2_test_diag}.bin "$HOSTDRV_DIR/tick/"
          (cd "$HOSTDRV_DIR" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/s1-sums"
          cp "$RUNNER_TEMP/s1-sums" "$HOSTDRV_DIR/SHA256SUMS"
          tar -C "$RUNNER_TEMP" -czf "$package/tick-s1-hostdrv.tar.gz" s1-hostdrv
          cp build/out/kernel.map "$package/"
          cp "build/out/$object" "$package/$object"
          (cd "$package" && sha256sum tick-s1-hostdrv.tar.gz kernel.map "$object" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tick-s1-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/tick-s1/
          retention-days: 30
          if-no-files-found: error
  artifacts:
    needs: plan
    if: needs.plan.outputs.pc98 != 'none'
    outputs:
      name: ${{ steps.name.outputs.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-setup
      - name: Set product build identity
        run: |
          echo "OS32_BUILD_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
      - name: Build candidate boot FD
        if: needs.plan.outputs.pc98 == 'fd'
        env:
          OS32_ACCEPT_IPA_LICENSE: "1"
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          inputs=$(python3 tools/mkpkg.py --plan build/packages.yaml --fd-inputs --fd-loader boot/loader_fat_new.bin)
          make -j"$(nproc)" images/os32_boot.d88 "FDD_IMAGE_DEPS=boot/boot_fat.bin $inputs"
          mkdir -p out
          cp images/os32_boot.d88 out/
          echo "commit: $GITHUB_SHA (boot FD)" > out/BUILD_INFO.txt
          (cd out && sha256sum os32_boot.d88 > SHA256SUMS)
      - name: Build distribution prerequisites
        if: needs.plan.outputs.pc98 == 'distribution'
        env:
          OS32_ACCEPT_IPA_LICENSE: "1"
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          i386-elf-gcc --version | head -1
          targets=(kernel-r1 build/out/kdebug.bin build/out/hwdev.mod iso)
          if [[ "${{ needs.plan.outputs.userland }}" == true ]]; then targets+=(programs); fi
          if [[ "${{ needs.plan.outputs.sdk }}" == true ]]; then targets+=(all); fi
          make -j"$(nproc)" "${targets[@]}" CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"

      # ⑤ 成果物: カーネル・起動 FD・インストール ISO・パッケージ・実機更新用の配備元 (hostdrv.tar.gz)。
      #    BUILD_INFO.txt と SHA256SUMS は tools/ci_fetch.sh が読む。
      - name: Artifact name
        id: name
        run: echo "artifact=os32-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # kapi_sys.o は make ごとに再コンパイルされる。FD / ISO / HostDrv を 1 呼出しで作る。
      # deploy-u3 は FD を作ってから HostDrv を同期する (hsync の名札も含む)。
      # 生 2HD は D88 の副生成物、ISO は phony の iso で必ず作り直す。
      - name: Deploy set (same-build FD, ISO and HostDrv)
        if: needs.plan.outputs.pc98 == 'distribution'
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/hostdrv" "$RUNNER_TEMP/np21w"
          make -j"$(nproc)" deploy-u3 iso CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w" \
            HOSTDRV_DIR="$RUNNER_TEMP/hostdrv" NO_PRUNE=1
          # make all の古い世代 hash を、今の成果物で更新する (make は再度呼ばない)。
          python3 tools/gen_generation_manifest.py
          python3 tools/gen_deploy_set.py
          test -f "$RUNNER_TEMP/hostdrv/.deploy/manifest.txt"

      - name: Collect outputs
        if: needs.plan.outputs.pc98 == 'distribution'
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/packages
          # kernel.elf: 実機の peek が記号名を引く (os32_build_commit と Image CRC の照合、TASK_KPEEK §3)。strip しない。
          cp build/out/vmkernel.lz4 build/out/kernel.map build/out/kernel.elf out/
          cp images/os32_boot.d88 images/os32_boot.img images/os32_boot144.img images/os32_install.iso out/
          cp build/out/deploy-set.json out/
          if [ -f build/out/generations-manifest.json ]; then
            cp build/out/generations-manifest.json out/
          fi
          cp packages/*.PKG out/packages/
          # 配布用の FAT12 / D88 reader で、配布する像の中身を読む。
          python3 - "$RUNNER_TEMP/hostdrv" > "$RUNNER_TEMP/deploy-check.txt" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          from fd_reader import d88_to_raw, fat12_files

          host_sha = hashlib.sha256((Path(sys.argv[1]) / "boot/vmkernel.lz4").read_bytes()).hexdigest()
          print(f"hostdrv boot/vmkernel.lz4 sha256: {host_sha}")
          for name in ("os32_boot.img", "os32_boot144.img"):
              files, _, _ = fat12_files(Path("out") / name)
              fd_sha = hashlib.sha256(files["/VMKRNL.LZ4"]).hexdigest()
              print(f"FD {name} VMKRNL.LZ4 sha256: {fd_sha}", flush=True)
              if fd_sha != host_sha:
                  raise SystemExit(f"FD / hostdrv kernel mismatch: {name}")
          if d88_to_raw(Path("out/os32_boot.d88").read_bytes()) != Path("out/os32_boot.img").read_bytes():
              raise SystemExit("D88 / raw FD mismatch")
          if hashlib.sha256(Path("out/vmkernel.lz4").read_bytes()).hexdigest() != host_sha:
              raise SystemExit("artifact / hostdrv kernel mismatch")
          print("FD / hostdrv kernel sha256: MATCH; D88 / raw FD: MATCH")
          PY
          cat "$RUNNER_TEMP/deploy-check.txt"
          if python3 tools/deploy_source_check.py --root "$RUNNER_TEMP/hostdrv" \
              --deploy-set out/deploy-set.json > /dev/null; then
            echo "deploy_source_check --deploy-set: rc=0 (FD / hostdrv / deploy-set: same build)" \
              >> "$RUNNER_TEMP/deploy-check.txt"
          else
            rc=$?
            echo "deploy_source_check --deploy-set: rc=$rc" >&2
            exit "$rc"
          fi
          tar -C "$RUNNER_TEMP" -czf out/hostdrv.tar.gz hostdrv
          {
            echo "commit:  $GITHUB_SHA"
            echo "ref:     $GITHUB_REF_NAME"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "gcc:     $("$CROSS_DIR/bin/i386-elf-gcc" -dumpversion)"
            echo "rustc:   $(rustc --version)"
            echo "external: 0 (apps/game are not built in v3 CI)"
            cat "$RUNNER_TEMP/deploy-check.txt"
            echo
            echo "# size  path"
            (cd out && find . -type f -printf '%s  %P\n' | sort -k2)
          } > out/BUILD_INFO.txt
          (cd out && find . -type f ! -name BUILD_INFO.txt ! -name SHA256SUMS -printf '%P\n' \
             | sort | xargs sha256sum) > out/SHA256SUMS
          cat out/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/
          retention-days: 30
          if-no-files-found: error
  powerpc:
    needs: plan
    if: needs.plan.outputs.powerpc != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.powerpc) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-setup
      - uses: ./.github/actions/ppc-setup
      - name: Set product build identity
        run: |
          echo "OS32_BUILD_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
      - name: Build PowerPC media
        env:
          PPC_SEL: ${{ matrix.image }}
          OS32_ACCEPT_IPA_LICENSE: "1"
        run: |
          case "$PPC_SEL" in
            core) flags=(KBOOT_LINK=0); dir=. ;;
            link) flags=(KBOOT_LINK=1); dir=link ;;
            sh) flags=(KBOOT_SH=1 KBOOT_LINK=0); dir=link-sh ;;
            link-sh) flags=(KBOOT_SH=1); dir=link-sh ;;
            shell) flags=(KBOOT_SHELL=1 KBOOT_LINK=0); dir=link-sh ;;
            neg1) flags=(NEGATIVE=1 KBOOT_LINK=0); dir=neg1 ;;
          esac
          make -j"$(nproc)" ARCH=ppc PLATFORM=powermac "${flags[@]}" all iso
          mkdir -p out
          cp "build/out/ppc-kboot/$dir/"{PPCKERN.ELF,boot.iso} out/
          (cd out && sha256sum PPCKERN.ELF boot.iso > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ppc-${{ matrix.image }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
  plan:
    env:
      GATE: ${{ (github.event_name != 'push' || startsWith(github.ref_name, 'wt/int-') || github.ref_name == 'main') && 'main' || 'push' }}
    runs-on: ubuntu-latest
    outputs:
      pc98: ${{ steps.plan.outputs.pc98 }}
      powerpc: ${{ steps.plan.outputs.powerpc }}
      sdk: ${{ steps.plan.outputs.sdk }}
      userland: ${{ steps.plan.outputs.userland }}
      bundles: ${{ steps.plan.outputs.bundles }}
      kapi_base: ${{ steps.comparison.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select KAPI comparison commit
        id: comparison
        env:
          BEFORE: ${{ github.event.before || inputs.kapi_base }}
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            base="${BEFORE:-$(git rev-parse HEAD^)}"
          else
            base=$(git merge-base origin/main "$GITHUB_SHA")
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "OS32_CI_BASE=$base" >> "$GITHUB_ENV"
          echo "OS32_KAPI_BASE=$base" >> "$GITHUB_ENV"
      - run: python3 -m pip install markdown-it-py PyYAML
      - id: plan
        run: |
          bundles=$(python3 -B -m tests.infra.ci plan --gate "$GATE" --mutate --output "$RUNNER_TEMP/planned")
          jq -r '.selection | "pc98=\(.pc98)", "userland=\(.userland)", "sdk=\(.sdk)", "powerpc=\(.powerpc|tojson)"' "$RUNNER_TEMP/planned/plan.json" >> "$GITHUB_OUTPUT"
          echo "bundles=$bundles" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/planned/plan.json
          if-no-files-found: error
      - run: python3 -B -m tests.infra.ci lint
  checks-host:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.bundles), 'host')
    uses: ./.github/workflows/restructure-check-bundle.yml
    with:
      bundle: host
      kapi_base: ${{ needs.plan.outputs.kapi_base }}
  checks-x86:
    needs: [plan, artifacts]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.artifacts.result == 'skipped') &&
      contains(fromJSON(needs.plan.outputs.bundles), 'x86')
    uses: ./.github/workflows/restructure-check-bundle.yml
    with:
      bundle: x86
      kapi_base: ${{ needs.plan.outputs.kapi_base }}
      pc98_artifact: ${{ needs.artifacts.outputs.name }}
  checks-ppc:
    needs: [plan, powerpc]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.powerpc.result == 'success' || needs.powerpc.result == 'skipped') &&
      contains(fromJSON(needs.plan.outputs.bundles), 'ppc')
    uses: ./.github/workflows/restructure-check-bundle.yml
    with:
      bundle: ppc
      ppc_media: ${{ needs.plan.outputs.powerpc != '[]' }}
      kapi_base: ${{ needs.plan.outputs.kapi_base }}
  collect:
    needs: [plan, artifacts, powerpc, checks-host, checks-x86, checks-ppc]
    if: always()
    runs-on: ubuntu-latest
    env:
      OS32_JOB_RESULTS: ${{ toJSON(needs) }}
      OS32_CI_BASE: ${{ needs.plan.outputs.kapi_base }}
      OS32_KAPI_BASE: ${{ needs.plan.outputs.kapi_base }}
      GATE: ${{ (github.event_name != 'push' || startsWith(github.ref_name, 'wt/int-') || github.ref_name == 'main') && 'main' || 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install markdown-it-py PyYAML
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/planned
      - uses: actions/download-artifact@v4
        with:
          pattern: checks-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - if: always()
        run: python3 -B -m tests.infra.ci collect --mutate --gate "$GATE" --output "$RUNNER_TEMP/results" --plan-file "$RUNNER_TEMP/planned/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/summary.json
          if-no-files-found: error
