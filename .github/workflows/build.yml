# OS32 本体ビルド (os32-v3、2026-09-30、docs/tasks/v3/FORK_PLAN.md §3 d ②、docs/08_build.md §8-6)
#
# 素の clone から core (カーネル・起動 FD・インストール ISO・パッケージ) を作り、
# `make check-fast` (静的ゲート check.yml に入らない、ツールチェーンと rustc が要る検査を含む) を
# 回して、成果物を artifact に置く。実機に繋がったホストは tools/ci_fetch.sh で取りに来る。
#
# - i386-elf ツールチェーン (binutils 2.41 / GCC 13.2.0 / newlib 4.4.0 nano) は
#   tools/ci/build_cross.sh でソースから作り、actions/cache に置く (初回とキーが変わったとき
#   だけ約 25〜30 分。キーは OS・gcc/newlib の版・構築入力と builder の hash)。
# - IPAex フォント (ipaexg.ttf / ipaexm.ttf) はリポジトリに無く tools/fetch_fonts.py が
#   IPA の公式配布から取る。取れた ttf は zip の SHA-256 を key にキャッシュする。
# - apps/game (private submodule) は v3 の開発では組まない (ユーザー決定 2026-09-30)。
#   必要になったら SUBMODULE_TOKEN で ⑥ (submodule 取得 + make external) を足す (FORK_PLAN §3 d ③)。
name: build

on:
  push:
    branches: [main, "wt/**"]
    tags: ["v*"]
    # 文書だけの push では回さない (文書の検査は check.yml が持つ)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # カーネルに埋める commit id (tools/gen_build_id.py) は `git rev-parse --short HEAD` だけでよいが、
      # 下の旧版を取り出す試験のために履歴を全部取る。
      - uses: actions/checkout@v4
        with:
          # test_h4_manifest の旧 hsync との互換の試験が `git show 0c71845:...` で旧版を取り出す (FDRECOV-1)。浅い clone では見つからない。
          fetch-depth: 0

      # Ubuntu の apt 依存 (Makefile / tools を grep して列挙、2026-09-30):
      #   nasm (boot/、カーネルの .asm)、genisoimage (build/image.mk の ISO)、
      #   build-essential (ホスト試験の gcc、ツールチェーンの構築)、e2fsprogs (ホスト試験の e2fsck / mke2fs)、
      #   libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex (build_cross.sh: GCC / binutils の構築)。
      #   FD イメージは tools/mkfat12.py (純 Python) なので mtools は要らない。
      # Python の依存は requirements.txt (ビルドの必須は lz4 と PyYAML、フォント生成に Pillow)。
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm genisoimage e2fsprogs qemu-user clang libclang-dev llvm-dev python3-clang \
            libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex
          python3 -m pip install --quiet -r requirements.txt

      # ② rust-toolchain.toml (nightly + rust-src) を rustup に解決させる。
      #    rustup 1.28 以降は引数なしの install で toml を読む (古い rustup は `rustup show` で入る)。
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update || rustup show
          rustup show active-toolchain
          rustc --version

      # ① i386-elf ツールチェーン (~/opt/cross、tools/ci/build_cross.sh の既定と同じ)。
      #    キー = OS + gcc/newlib の版 + 構築入力 / builder hash / inventory名 (SDK入力は除外)。
      - name: Toolchain cache key
        id: crosskey
        run: |
          echo "CROSS_DIR=$HOME/opt/cross" >> "$GITHUB_ENV"
          gcc="$(sed -n 's/^GCC_VER=//p' tools/ci/build_cross.sh)"
          newlib="$(sed -n 's/^NEWLIB_VER=//p' tools/ci/build_cross.sh)"
          k="$(python3 tools/check_nano_inputs.py --cache-key)"
          echo "key=cross-i386-elf-${{ runner.os }}-gcc${gcc}-newlib${newlib}-${k}" >> "$GITHUB_OUTPUT"

      - name: Cache i386-elf toolchain
        id: cross-cache
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: ${{ steps.crosskey.outputs.key }}

      - name: Build i386-elf toolchain (cache miss only)
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: tools/ci/build_cross.sh --prefix "$CROSS_DIR" --work "$RUNNER_TEMP/cross-work" --jobs "$(nproc)"

      # フォント。key = ipaex-<配布 zip の SHA-256 (fetch_fonts.py に固定)>。
      #    ヒットすれば fetch_fonts.py は SHA-256 を照合するだけで何も取らない。
      - name: Font cache key
        id: fontkey
        run: |
          echo "key=ipaex-$(python3 tools/fetch_fonts.py --print-zip-sha256)" >> "$GITHUB_OUTPUT"
          echo "latin=inconsolata-$(python3 tools/fetch_fonts.py --family inconsolata --print-zip-sha256)" >> "$GITHUB_OUTPUT"

      - name: Cache IPAex fonts
        uses: actions/cache@v4
        with:
          path: |
            assets/fonts/ipaexg.ttf
            assets/fonts/ipaexm.ttf
          key: ${{ steps.fontkey.outputs.key }}

      # 欧文 (Inconsolata + OFL) は IPA と別の key にして、IPA の既存キャッシュを使い続ける。
      - name: Cache Inconsolata font
        uses: actions/cache@v4
        with:
          path: |
            assets/fonts/Inconsolata-Regular.ttf
            assets/fonts/Inconsolata-OFL.txt
          key: ${{ steps.fontkey.outputs.latin }}

      - name: Fetch Inconsolata (verify cached font and OFL)
        run: python3 tools/fetch_fonts.py --family inconsolata

      # ③ core のビルド。OS32_ACCEPT_IPA_LICENSE=1 は、リポジトリ所有者が IPA Font License v1.0 に
      #    同意している前提で CI では非対話に同意する (未取得のときだけ fetch_fonts.py が見る)。
      #    all は配備しない。配布用の FD / ISO は後段で HostDrv と同じ build に揃える。
      - name: Build core (make all)
        env:
          OS32_ACCEPT_IPA_LICENSE: "1"
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          i386-elf-gcc --version | head -1
          make -j"$(nproc)" all CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"

      # ④ 変異なしの全検査 (成果物を読む check-manifests / check-packages-host / check-memmap と、
      #    クロスコンパイルや rustc が要るホスト試験を含む)。
      - name: make check-fast
        env:
          OS32_CLANG_CROSS_FREE: "0"
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          test -x "$CROSS_DIR/bin/i386-elf-gcc"
          test -f "$CROSS_DIR/i386-elf/include/stdio.h"
          make check-fast CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"

      # ⑤ 成果物: カーネル・起動 FD・インストール ISO・パッケージ・実機更新用の配備元 (hostdrv.tar.gz)。
      #    BUILD_INFO.txt と SHA256SUMS は tools/ci_fetch.sh が読む。
      - name: Artifact name
        id: name
        run: echo "artifact=os32-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # kapi_sys.o は make ごとに再コンパイルされる。FD / ISO / HostDrv を 1 呼出しで作る。
      # deploy-u3 は FD を作ってから HostDrv を同期する (hsync の名札も含む)。
      # 生 2HD は D88 の副生成物、ISO は phony の iso で必ず作り直す。
      - name: Deploy set (same-build FD, ISO and HostDrv)
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/hostdrv" "$RUNNER_TEMP/np21w"
          make -j"$(nproc)" deploy-u3 iso CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w" \
            HOSTDRV_DIR="$RUNNER_TEMP/hostdrv" NO_PRUNE=1
          # make all の古い世代 hash を、今の成果物で更新する (make は再度呼ばない)。
          python3 tools/gen_generation_manifest.py
          python3 tools/gen_deploy_set.py
          test -f "$RUNNER_TEMP/hostdrv/.deploy/manifest.txt"

      - name: Collect outputs
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/packages
          cp build/out/vmkernel.lz4 build/out/kernel.map out/
          cp images/os32_boot.d88 images/os32_boot.img images/os32_boot144.img images/os32_install.iso out/
          cp build/out/deploy-set.json out/
          if [ -f build/out/generations-manifest.json ]; then
            cp build/out/generations-manifest.json out/
          fi
          cp packages/*.PKG out/packages/
          # 既存の媒体試験の FAT12 / D88 reader で、配布する像の中身を読む。
          python3 - "$RUNNER_TEMP/hostdrv" > "$RUNNER_TEMP/deploy-check.txt" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/tests")
          from test_packages import d88_to_raw, fat12_files

          host_sha = hashlib.sha256((Path(sys.argv[1]) / "boot/vmkernel.lz4").read_bytes()).hexdigest()
          print(f"hostdrv boot/vmkernel.lz4 sha256: {host_sha}")
          for name in ("os32_boot.img", "os32_boot144.img"):
              files, _, _ = fat12_files(Path("out") / name)
              fd_sha = hashlib.sha256(files["/VMKRNL.LZ4"]).hexdigest()
              print(f"FD {name} VMKRNL.LZ4 sha256: {fd_sha}", flush=True)
              if fd_sha != host_sha:
                  raise SystemExit(f"FD / hostdrv kernel mismatch: {name}")
          if d88_to_raw(Path("out/os32_boot.d88").read_bytes()) != Path("out/os32_boot.img").read_bytes():
              raise SystemExit("D88 / raw FD mismatch")
          if hashlib.sha256(Path("out/vmkernel.lz4").read_bytes()).hexdigest() != host_sha:
              raise SystemExit("artifact / hostdrv kernel mismatch")
          print("FD / hostdrv kernel sha256: MATCH; D88 / raw FD: MATCH")
          PY
          cat "$RUNNER_TEMP/deploy-check.txt"
          if python3 tools/deploy_source_check.py --root "$RUNNER_TEMP/hostdrv" \
              --deploy-set out/deploy-set.json > /dev/null; then
            echo "deploy_source_check --deploy-set: rc=0 (FD / hostdrv / deploy-set: same build)" \
              >> "$RUNNER_TEMP/deploy-check.txt"
          else
            rc=$?
            echo "deploy_source_check --deploy-set: rc=$rc" >&2
            exit "$rc"
          fi
          tar -C "$RUNNER_TEMP" -czf out/hostdrv.tar.gz hostdrv
          {
            echo "commit:  $GITHUB_SHA"
            echo "ref:     $GITHUB_REF_NAME"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "gcc:     $("$CROSS_DIR/bin/i386-elf-gcc" -dumpversion)"
            echo "rustc:   $(rustc --version)"
            echo "external: 0 (apps/game are not built in v3 CI)"
            cat "$RUNNER_TEMP/deploy-check.txt"
            echo
            echo "# size  path"
            (cd out && find . -type f -printf '%s  %P\n' | sort -k2)
          } > out/BUILD_INFO.txt
          (cd out && find . -type f ! -name BUILD_INFO.txt ! -name SHA256SUMS -printf '%P\n' \
             | sort | xargs sha256sum) > out/SHA256SUMS
          cat out/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/
          retention-days: 30
          if-no-files-found: error
