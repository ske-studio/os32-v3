# OS32 本体ビルド (os32-v3、2026-09-30、docs/tasks/v3/FORK_PLAN.md §3 d ②、docs/08_build.md §8-6)
#
# 素の clone から core (カーネル・起動 FD・インストール ISO・パッケージ) を作り、
# `make check` (全部の検査を変異込みで。静的ゲート check.yml に入らない、ツールチェーンと rustc が要る検査を含む) を
# 6 シャードで並列に回す。配布物は検査の完了を待たず artifact に置く。実機に繋がったホストは tools/ci_fetch.sh で取りに来る。
#
# - i386-elf ツールチェーン (binutils 2.41 / GCC 13.2.0 / newlib 4.4.0 nano) は
#   tools/ci/build_cross.sh でソースから作り、actions/cache に置く (初回とキーが変わったとき
#   だけ約 25〜30 分。キーは OS・gcc/newlib の版・構築入力と builder の hash)。
# - IPAex フォント (ipaexg.ttf / ipaexm.ttf) はリポジトリに無く tools/fetch_fonts.py が
#   IPA の公式配布から取る。取れた ttf は zip の SHA-256 を key にキャッシュする。
# - apps/game (private submodule) は v3 の開発では組まない (ユーザー決定 2026-09-30)。
#   必要になったら SUBMODULE_TOKEN で ⑥ (submodule 取得 + make external) を足す (FORK_PLAN §3 d ③)。
name: build

on:
  push:
    branches: [main, "wt/**"]
    tags: ["v*"]
    # 文書だけの push では回さない (文書の検査は check.yml が持つ)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      tick_s1:
        description: Build the Ra266 S1 diagnostic HostDrv
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: build-${{ github.ref }}-artifacts
      cancel-in-progress: true
    steps:
      # カーネルに埋める commit id (tools/gen_build_id.py) は `git rev-parse --short HEAD` だけでよいが、
      # 下の旧版を取り出す試験のために履歴を全部取る。
      - uses: actions/checkout@v4
        with:
          # test_h4_manifest の旧 hsync との互換の試験が `git show 0c71845:...` で旧版を取り出す (FDRECOV-1)。浅い clone では見つからない。
          fetch-depth: 0

      - uses: ./.github/actions/build-setup
        timeout-minutes: 90

      - name: Compiler ccache setup
        timeout-minutes: 1
        id: compiler-cache-key
        run: &compiler_setup |
          echo "CCACHE_DIR=$RUNNER_TEMP/compiler-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          host="$(gcc -dumpfullversion -dumpversion)"
          cross="$("$CROSS_DIR/bin/i386-elf-gcc" -dumpfullversion -dumpversion)"
          echo "compilers=host${host}-cross${cross}" >> "$GITHUB_OUTPUT"

      - name: Cache C compilations
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/compiler-ccache
          key: c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}-artifacts
          restore-keys: &compiler_restore |
            c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}-
            c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-

      # ③ core のビルド。OS32_ACCEPT_IPA_LICENSE=1 は、リポジトリ所有者が IPA Font License v1.0 に
      #    同意している前提で CI では非対話に同意する (未取得のときだけ fetch_fonts.py が見る)。
      #    all は配備しない。配布用の FD / ISO は後段で HostDrv と同じ build に揃える。
      - name: Build core (make all)
        env:
          OS32_ACCEPT_IPA_LICENSE: "1"
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          i386-elf-gcc --version | head -1
          make -j"$(nproc)" all CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"

      # ⑤ 成果物: カーネル・起動 FD・インストール ISO・パッケージ・実機更新用の配備元 (hostdrv.tar.gz)。
      #    BUILD_INFO.txt と SHA256SUMS は tools/ci_fetch.sh が読む。
      - name: Artifact name
        id: name
        run: echo "artifact=os32-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # kapi_sys.o は make ごとに再コンパイルされる。FD / ISO / HostDrv を 1 呼出しで作る。
      # deploy-u3 は FD を作ってから HostDrv を同期する (hsync の名札も含む)。
      # 生 2HD は D88 の副生成物、ISO は phony の iso で必ず作り直す。
      - name: Deploy set (same-build FD, ISO and HostDrv)
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/hostdrv" "$RUNNER_TEMP/np21w"
          make -j"$(nproc)" deploy-u3 iso CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w" \
            HOSTDRV_DIR="$RUNNER_TEMP/hostdrv" NO_PRUNE=1
          # make all の古い世代 hash を、今の成果物で更新する (make は再度呼ばない)。
          python3 tools/gen_generation_manifest.py
          python3 tools/gen_deploy_set.py
          test -f "$RUNNER_TEMP/hostdrv/.deploy/manifest.txt"

      - name: Collect outputs
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/packages
          # kernel.elf: 実機の peek が記号名を引く (os32_build_commit と Image CRC の照合、TASK_KPEEK §3)。strip しない。
          cp build/out/vmkernel.lz4 build/out/kernel.map build/out/kernel.elf out/
          cp images/os32_boot.d88 images/os32_boot.img images/os32_boot144.img images/os32_install.iso out/
          cp build/out/deploy-set.json out/
          if [ -f build/out/generations-manifest.json ]; then
            cp build/out/generations-manifest.json out/
          fi
          cp packages/*.PKG out/packages/
          # 既存の媒体試験の FAT12 / D88 reader で、配布する像の中身を読む。
          python3 - "$RUNNER_TEMP/hostdrv" > "$RUNNER_TEMP/deploy-check.txt" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/tests")
          from test_packages import d88_to_raw, fat12_files

          host_sha = hashlib.sha256((Path(sys.argv[1]) / "boot/vmkernel.lz4").read_bytes()).hexdigest()
          print(f"hostdrv boot/vmkernel.lz4 sha256: {host_sha}")
          for name in ("os32_boot.img", "os32_boot144.img"):
              files, _, _ = fat12_files(Path("out") / name)
              fd_sha = hashlib.sha256(files["/VMKRNL.LZ4"]).hexdigest()
              print(f"FD {name} VMKRNL.LZ4 sha256: {fd_sha}", flush=True)
              if fd_sha != host_sha:
                  raise SystemExit(f"FD / hostdrv kernel mismatch: {name}")
          if d88_to_raw(Path("out/os32_boot.d88").read_bytes()) != Path("out/os32_boot.img").read_bytes():
              raise SystemExit("D88 / raw FD mismatch")
          if hashlib.sha256(Path("out/vmkernel.lz4").read_bytes()).hexdigest() != host_sha:
              raise SystemExit("artifact / hostdrv kernel mismatch")
          print("FD / hostdrv kernel sha256: MATCH; D88 / raw FD: MATCH")
          PY
          cat "$RUNNER_TEMP/deploy-check.txt"
          if python3 tools/deploy_source_check.py --root "$RUNNER_TEMP/hostdrv" \
              --deploy-set out/deploy-set.json > /dev/null; then
            echo "deploy_source_check --deploy-set: rc=0 (FD / hostdrv / deploy-set: same build)" \
              >> "$RUNNER_TEMP/deploy-check.txt"
          else
            rc=$?
            echo "deploy_source_check --deploy-set: rc=$rc" >&2
            exit "$rc"
          fi
          tar -C "$RUNNER_TEMP" -czf out/hostdrv.tar.gz hostdrv
          {
            echo "commit:  $GITHUB_SHA"
            echo "ref:     $GITHUB_REF_NAME"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "gcc:     $("$CROSS_DIR/bin/i386-elf-gcc" -dumpversion)"
            echo "rustc:   $(rustc --version)"
            echo "external: 0 (apps/game are not built in v3 CI)"
            cat "$RUNNER_TEMP/deploy-check.txt"
            echo
            echo "# size  path"
            (cd out && find . -type f -printf '%s  %P\n' | sort -k2)
          } > out/BUILD_INFO.txt
          (cd out && find . -type f ! -name BUILD_INFO.txt ! -name SHA256SUMS -printf '%P\n' \
             | sort | xargs sha256sum) > out/SHA256SUMS
          cat out/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Build S1 diagnostic HostDrv
        if: inputs.tick_s1
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          export HOSTDRV_DIR="$RUNNER_TEMP/s1-hostdrv"
          mv build/out "$RUNNER_TEMP/product-out"
          mkdir -p "$HOSTDRV_DIR"
          make -j"$(nproc)" TICK_PROBE_BUILD=1 all build/out/tickprobe.bin build/out/snd2_test_diag.bin
          python3 tools/hostdrv_deploy.py sync
          mkdir -p "$HOSTDRV_DIR/tick"
          cp build/out/tickprobe.bin "$HOSTDRV_DIR/tick/"
          cp build/out/snd2_test_diag.bin "$HOSTDRV_DIR/tick/snd2_test.bin"
          (cd "$HOSTDRV_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/s1-sums"
          cp "$RUNNER_TEMP/s1-sums" "$HOSTDRV_DIR/SHA256SUMS"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/tick-s1-hostdrv.tar.gz" s1-hostdrv

      - uses: actions/upload-artifact@v4
        if: inputs.tick_s1
        with:
          name: tick-s1-${{ github.sha }}
          path: ${{ runner.temp }}/tick-s1-hostdrv.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Compiler ccache statistics
        if: always()
        run: ccache -s

  checks:
    outputs:
      warm: ${{ steps.dialect-owner.outputs.warm }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ fromJSON(github.event_name == 'push' && github.run_attempt == 1 && github.repository == 'ske-studio/os32-v3' && github.actor == 'ske-studio' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wt/')) && contains(fromJSON(vars.OS32_SELFHOST_SHARDS || '[]'), matrix.shard) && '["self-hosted","linux","x64","os32-ci"]' || '"ubuntu-latest"') }}
    timeout-minutes: 150
    concurrency:
      group: build-${{ github.ref }}-checks-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      # カーネルに埋める commit id (tools/gen_build_id.py) は `git rev-parse --short HEAD` だけでよいが、
      # 下の旧版を取り出す試験のために履歴を全部取る。
      - uses: actions/checkout@v4
        with:
          # test_h4_manifest の旧 hsync との互換の試験が `git show 0c71845:...` で旧版を取り出す (FDRECOV-1)。浅い clone では見つからない。
          fetch-depth: 0

      - name: Reuse successful integration checks
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: build.yml
        run: python3 -B tools/ci/reuse_success.py

      - name: Locate c-dialect shard
        id: dialect-owner
        run: |
          checks="$(python3 -B tools/checks/run.py --list --exclude-env qemu-ppc --shard ${{ matrix.shard }}/6)"
          if grep -Fxq check-c-dialect <<< "$checks"; then
            echo "owner=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ steps.prior.outputs.reuse }}" == true ]]; then
              echo "warm=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: ./.github/actions/build-setup
        timeout-minutes: 90
        if: steps.prior.outputs.reuse != 'true'

      - name: Compiler ccache setup
        timeout-minutes: 1
        if: steps.prior.outputs.reuse != 'true'
        id: compiler-cache-key
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/compiler-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          host="$(gcc -dumpfullversion -dumpversion)"
          cross="$("$CROSS_DIR/bin/i386-elf-gcc" -dumpfullversion -dumpversion)"
          echo "compilers=host${host}-cross${cross}" >> "$GITHUB_OUTPUT"

      - name: Cache C compilations
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        if: steps.prior.outputs.reuse != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/compiler-ccache
          key: c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}-check-${{ matrix.shard }}
          restore-keys: |
            c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}-
            c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-

      - name: Restore c-dialect results
        id: dialect-cache
        if: steps.dialect-owner.outputs.owner == 'true' && steps.prior.outputs.reuse != 'true'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with: &dialect_restore
          path: &dialect_path .ci-cache/check-cache/v1/c-dialect
          key: &dialect_key check-cache/v1/c-dialect-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}
          restore-keys: check-cache/v1/c-dialect-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache-key.outputs.compilers }}-

      - name: Runner load before make check
        if: steps.prior.outputs.reuse != 'true'
        continue-on-error: true
        run: &runner_load |
          nproc
          uptime
          for resource in cpu io; do
              if [ -r "/proc/pressure/$resource" ]; then
                  echo "$resource pressure"
                  cat "/proc/pressure/$resource"
              fi
          done
          df -h .

      # check-prepare はこのシャードの needs だけを組む。
      # ④ 全部の検査を**変異込み**で (成果物を読む check-manifests / check-packages-host / check-memmap と、
      #    クロスコンパイルや rustc が要るホスト試験を含む)。変異は関門の中で見る (docs/POLICY_CI.md G1)。
      - name: make check
        timeout-minutes: 60
        if: steps.prior.outputs.reuse != 'true'
        env: &check_env
          OS32_ACCEPT_IPA_LICENSE: "1"
          OS32_CLANG_CROSS_FREE: "0"
          OS32_CHECK_CACHE: ${{ github.workspace }}/.ci-cache/check-cache
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          test -x "$CROSS_DIR/bin/i386-elf-gcc"
          test -f "$CROSS_DIR/i386-elf/include/stdio.h"
          make -k check CHECK_SHARD=${{ matrix.shard }}/6 CHECK_EXCLUDE_ENV=qemu-ppc CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"

      - name: Runner load after make check
        if: always() && steps.prior.outputs.reuse != 'true'
        continue-on-error: true
        run: *runner_load

      - name: Save c-dialect results
        if: steps.dialect-owner.outputs.owner == 'true' && steps.prior.outputs.reuse != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.dialect-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with: &dialect_save
          path: *dialect_path
          key: *dialect_key

      # 検査ごとの実時間 (tools/check_time.py: 検査名・経過秒数・終了コード) を残し、
      # budget の棚卸の材料にする (2026-11-08、budget 超えは警告だけで結果は落とさない)。
      - name: Collect check times
        if: always() && steps.prior.outputs.reuse != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/check-times"
          if [ -f build/out/check_times.tsv ]; then
            cp build/out/check_times.tsv "$RUNNER_TEMP/check-times/"
          else
            echo 'check_times.tsv unavailable' > "$RUNNER_TEMP/check-times/missing.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.prior.outputs.reuse != 'true'
        with:
          name: check-times-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/check-times/
          retention-days: 30
          if-no-files-found: error

      - name: Compiler ccache statistics
        if: always() && steps.prior.outputs.reuse != 'true'
        run: ccache -s

  warm-c-dialect:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.checks.outputs.warm == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-setup
        timeout-minutes: 90
      - name: Compiler ccache setup
        id: compiler-cache-key
        run: *compiler_setup
      - name: Restore C compilations
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/compiler-ccache
          key: c-v2-${{ runner.os }}-${{ steps.compiler-cache-key.outputs.compilers }}-${{ github.sha }}-warm
          restore-keys: *compiler_restore
      - uses: actions/cache/restore@v4
        id: dialect-cache
        continue-on-error: true
        with: *dialect_restore
      - name: Warm c-dialect results
        env: *check_env
        run: |
          export PATH="$CROSS_DIR/bin:$PATH"
          make check-c-dialect CROSS_DIR="$CROSS_DIR" NP21W_DIR="$RUNNER_TEMP/np21w"
      - uses: actions/cache/save@v4
        if: steps.dialect-cache.outputs.cache-hit != 'true'
        with: *dialect_save
