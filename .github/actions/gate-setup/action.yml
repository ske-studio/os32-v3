name: OS32 full check environment
description: Every tool any check needs (x86 and PowerPC cross compilers, QEMU, gcc-13), prepared in one place
# 手本の CI (docs/design/tools/ci/gate.md §3-4): 用意の手順はここ 1 か所。ジョブごとに apt の行を
# 書き写さない。どのジョブも同じ環境なので、道具が無くて SKIP になる検査が無い。
runs:
  using: composite
  steps:
    - name: Host packages beyond the build setup
      shell: timeout 600 bash --noprofile --norc -e -o pipefail {0}
      run: |
        sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=20 update
        # mac99 の firmware (qemu-system-data) と VGA の ROM (seabios) を名指しで入れる。無いと QEMU が
        # 起動直後に終わる。メタパッケージ qemu-system は全 arch の QEMU (約 100MB) を連れてきて、遅い
        # ミラーで 600 秒を越えた (2026-11-18、run 44307127004 の ppc-qemu (2)) ので使わない。
        sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=20 install -y --no-install-recommends gcc-13 qemu-system-ppc qemu-system-data seabios
    - uses: ./.github/actions/build-setup
    - uses: ./.github/actions/ppc-setup
    - name: Python requirements and cross compiler on PATH
      shell: timeout 300 bash --noprofile --norc -e -o pipefail {0}
      run: |
        python3 -m pip install --quiet -r requirements.txt
        echo "$CROSS_DIR/bin" >> "$GITHUB_PATH"
