name: OS32 static gate environment
description: Host tools for the cross-free static gate (check.yml static-check), prepared in one place
# 静的ゲート (check の static-check) の用意。クロスコンパイラと rustc は入れない (クロス無しで回せる
# 検査だけを回すジョブ)。ジョブに apt の行を書かない (docs/POLICY_CI.md G5、票 TASK_CI_REWORK の段 S2c)。
runs:
  using: composite
  steps:
    # ホスト試験の外部コマンド: gcc (build-essential)、e2fsck / mke2fs (e2fsprogs)。
    # C AST の vendor include は libnewlib-dev のヘッダで解析する (クロス GCC は不要)。
    # Python は tools/mkvmkernel.py 系が lz4 を使う。
    - name: Host dependencies
      shell: bash
      run: |
        rc=0
        timeout -k 30 300 sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=20 update &&
        timeout -k 30 600 sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=20 install -y --no-install-recommends ccache build-essential e2fsprogs clang libclang-dev llvm-dev python3-clang libnewlib-dev || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::error::static-setup: apt-get が rc=$rc (124 = 時間切れ)"
          echo "### 用意の失敗: apt-get rc=$rc (検査は始めていない)" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
        fi
        python3 -m pip install --quiet PyYAML lz4
    - name: Preflight (static)
      shell: bash
      run: python3 -B tools/ci/gate.py preflight --env static
